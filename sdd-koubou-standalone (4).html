= (tmp_path / \"audit.jsonl\").read_text(encoding=\"utf-8\").splitlines()[0]\n    rec = json.loads(line)\n    for key in REQUIRED:\n        assert key in rec\n# input_ref / output_ref は、本文ではなくIDやハッシュにする（個人情報をログに残さないため）\n```\n\n**プライバシーと追跡可能性は両立させる**必要があります。ログには**本文ではなく、ID・版・ハッシュ**を残し、必要なときだけ別の保管先で本文を参照できるようにします。\n\n### 8-6. 進め方（人の判断を中心に）\n\n```mermaid\nflowchart LR\n  A[自分の立場と<br>責任範囲を確認] --> B[観点の変換<br>7A/7B→テスト観点]\n  B --> C[テスト実施<br>自動＋人]\n  C --> D[人が評価・判断<br>許容性・該当判断]\n  D --> E[記録・承認]\n  E --> F[定期見直し<br>ガイドライン改訂・モデル更新時]\n```\n\n| ステップ | 担当 | 内容 |\n|---|---|---|\n| ① 立場の確認 | 人 | 役割分担表を作る（誰が何に責任を持つか） |\n| ② 観点の変換 | 人（AIは案） | チェック項目を、検証可能な観点に |\n| ③ テスト | 自動＋人 | 第5章の方法（モック・評価セット）で実施。結果を記録 |\n| ④ 評価・判断 | **人** | 許容性（特に公平性）の評価、7B の該当判断 |\n| ⑤ 承認 | 責任者 | リリース判断の一部として承認 |\n| ⑥ 見直し | 人 | ガイドライン改訂・モデル更新・仕様変更のたびに再確認 |\n\n### 8-7. AIにトレーサビリティ表の下書きを作らせる\n\n```text\n次のチェック項目の趣旨（G-01〜G-09）を、docs/spec/ の要求IDと対応づけて、\nトレーサビリティ表（観点ID・対応要求ID・テスト案・方法・合格基準の案・証跡）の下書きを作って。\nルール：\n- 合格基準は「案」として書き、決定は人が行うと明記する\n- 対応する要求がない観点は「要求不足」として列挙する\n- ガイドラインの条文・文言を記憶で引用しない\n- 該当判断（該当／非該当）は書かない。判断は人が行う\n```\n\n### 8-8. 注意点\n\n| 注意点 | 内容 |\n|---|---|\n| チェックリストが全部「できている」でも、品質保証にはならない | 取組みの有無の確認であり、**出力の品質は評価セットと人の採点で確認**する |\n| 基準を人が決めずにAIに任せる | 公平性の許容範囲などは、**事業・リスクに基づいて人が決める** |\n| 版の確認漏れ | ガイドラインは改訂される。別添の版（日付）を記録する |\n| 法令・契約との混同 | ガイドラインは法令ではない。**個人情報保護法などの法令、契約、顧客規程は別に確認**する |\n\n### 🧪 第8章 確認\n\n**Q.** 別添7B（広島AIプロセス）の項目が、自分のシステムに「非該当」と判断したとき、やるべきことは？\n\n:::details 答え例\n**理由と判断者・日付を記録**します。非該当でも、後から説明できるようにします。判断は人が行います。\n:::\n\n---\n\n## 9. 理解度テスト\n\n先に自分で答えを考えてから、答えを開いてください（思い出す作業が定着を助ける：Roediger & Karpicke, 2006）。\n\n**Q1.** 仕様選定で「検証可能性」を評価軸に入れる理由は？\n**Q2.** AIに選択肢を出させるとき、プロンプトに入れてはいけない指示は？（入れるべきでない内容）\n**Q3.** Claude API を使うアプリで、実APIを呼ばずにテストできる部分を2つ挙げてください。\n**Q4.** 出力がぶれるAIのテストで、1回の成否ではなく合格率で見る理由は？\n**Q5.** LLM-as-a-Judge を使うとき、なぜ人で較正するのですか？\n**Q6.** Claude Code が「テストを書き換えて通す」ことを防ぐには？\n**Q7.** カバレッジ100%でも安心できない理由は？\n**Q8.** テスト失敗時、原因の区分を5つ挙げてください。\n**Q9.** AI事業者ガイドラインのチェックリストが「全項目できている」と答えられても、それだけでは品質保証にならない理由は？\n**Q10.** プライバシーとトレーサビリティを両立するため、ログには何を残しますか？\n\n:::details 解答例\n**A1.** テストで確かめられない仕様を採用すると、品質を保証できなくなるため。\n**A2.** 「どれを採るべきか推奨して」（決めるのは人。推奨を書かせず、評価軸で人が比べる）。\n**A3.** マスキング・前処理、出力のパースと形式検査、API呼び出しの引数、エラー処理など。\n**A4.** 出力は毎回変わりうるため、複数回の傾向で品質を判断する必要がある。通るまで再実行するのは保証にならない。\n**A5.** LLM判定には偏りがあるため、人の採点との一致を確認し、一致しない場合は補助にとどめる（Zheng et al., 2023）。\n**A6.** CLAUDE.md にルールを書く（既存テストの変更・削除・スキップは人の承認が必要）。テストレビュー担当（読み取り専用）で確認し、人が差分を読む。\n**A7.** 行が実行されただけで、その結果が検証されているとは限らないため。ミューテーションテストなどで、テストの強さを別に確認する。\n**A8.** 仕様／実装／テスト／プロンプト／モデル更新／データ（このうち5つ）。\n**A9.** チェックリストは取組みの有無を問う自己点検であり、出力の品質や許容性は、評価セット・テスト・人の採点で確認する必要があるため。\n**A10.** 本文ではなく、ID・プロンプト版・モデル版・ハッシュ・人の判断などを残し、必要時のみ別の保管先で本文を参照する。\n:::\n\n---\n\n## まとめ\n\n| 論点 | 要点 |\n|---|---|\n| 品質の3軸 | 仕様の品質・実装の品質・AI出力の品質 |\n| 人の判断 | 仕様選定・合格基準・リリース判断は人。AIは選択肢と下書き |\n| 従来手法 | 境界値・同値分割・デシジョンテーブル・ペアワイズ・プロパティ・ミューテーション・探索的 |\n| AI出力のテスト | 決定的／API境界（モック）／実API（評価セット・合格率）に分ける |\n| Claude Code | テスト先行。テストを緩めさせない。読み取り専用のレビュー担当 |\n| リリース | 品質ゲートと、決定者の承認 |\n\nAIで実装が速くなるほど、**何を作るかを選ぶ（仕様選定）**と**確かめる（テスト・評価）**の価値が上がります。まずは、次の機能で「決定記録（DEC）」と「境界値テスト」の2つから試してみてください。\n\n---\n\n## 参考文献\n\n### 公式ドキュメント（最新を確認してください）\n\n- Claude Code: https://docs.claude.com/en/docs/claude-code/overview\n- Claude API: https://docs.claude.com\n- 評価・テストの考え方（Claude の公式ドキュメント内「テストと評価」の項目）: https://docs.claude.com\n- Python pytest: https://docs.pytest.org\n- Hypothesis（プロパティベーステスト）: https://hypothesis.readthedocs.io\n\n### 規格・知識体系（版と本文は原典で確認）\n\n- ISO/IEC/IEEE 29119 — Software testing\n- ISO/IEC 25010 — Product quality model／ISO/IEC 25040 — Evaluation process\n- ISO/IEC/IEEE 29148 — Requirements engineering\n- ISO/IEC/IEEE 12207 — Software life cycle processes\n- ISO/IEC 20246 — Work product reviews\n- JSTQB／ISTQB シラバス（日本語版の版は要確認）\n- 総務省・経済産業省「AI事業者ガイドライン」別添7（チェックリスト 7A 全主体向け／7B 広島AIプロセス）（令和8年3月31日版を参照。最新版は公開資料で確認）\n- SQuBOK ガイド（ソフトウェア品質知識体系ガイド、日本科学技術連盟。版は要確認）\n\n### 査読済み論文\n\n[^1]: Roediger, H. L., & Karpicke, J. D. (2006). Test-enhanced learning. *Psychological Science, 17*(3), 249–255.\n[^2]: Parasuraman, R., & Manzey, D. H. (2010). Complacency and Bias in Human Use of Automation. *Human Factors, 52*(3), 381–410.\n[^3]: Kuhn, D. R., Wallace, D. R., & Gallo, A. M. (2004). Software fault interactions and implications for software testing. *IEEE Transactions on Software Engineering, 30*(6), 418–421.\n[^4]: Claessen, K., & Hughes, J. (2000). QuickCheck: a lightweight tool for random testing of Haskell programs. *Proceedings of ICFP 2000*.\n[^5]: Jia, Y., & Harman, M. (2011). An analysis and survey of the development of mutation testing. *IEEE Transactions on Software Engineering, 37*(5), 649–678.\n[^6]: Ribeiro, M. T., Wu, T., Guestrin, C., & Singh, S. (2020). Beyond Accuracy: Behavioral Testing of NLP Models with CheckList. *Proceedings of ACL 2020*.\n[^7]: Luo, Q., Hariri, F., Eloussi, L., & Marinov, D. (2014). An empirical analysis of flaky tests. *Proceedings of FSE 2014*.\n[^8]: Zheng, L., et al. (2023). Judging LLM-as-a-Judge with MT-Bench and Chatbot Arena. *NeurIPS 2023 Datasets and Benchmarks*.\n\n:::message\n- 論文は「考え方の背景」として引用しています。論文の結果が、Claude Code や Claude API を使った実務での効果を直接保証するものではありません。\n- 巻号・ページ・発表先、規格・知識体系の版は、投稿前に原典で確認してください。\n- **国内の査読済み論文**は、情報処理学会論文誌・J-STAGE などで「ソフトウェアテスト」「テスト設計」「LLM 評価」を検索して追補してください。確認できない題名は載せていません。\n- コード・コマンド・設定は骨組みです。実機で動作確認し、プロジェクトのリスクに合わせて調整してください。\n:::\n"}, {"id": "a4", "no": "④", "short": "客先で使うヒアリング・合意形成・納品説明", "kind": "記事④", "title": "【DXエンジニア向け】客先で使えるヒアリングシート×合意形成×AI仕様駆動開発｜評価・レビュー・納品説明までの進め方", "md": "## はじめに\n\nこんにちは、うさうさ研修工房のYukiです。\n\nClaude Code のようなAIを使うと、実装は速くなります。しかし客先の案件では、**実装の前後**で次のような問題が起きがちです。\n\n| 場面 | よくある問題 |\n| :---- | :---- |\n| ヒアリング | 聞き漏れ。あとから「実は〜も必要」と言われる |\n| 合意 | 「たぶんこういうことだよね」で進み、認識がずれる |\n| 開発 | AIが仕様の穴を推測で埋め、期待と違うものができる |\n| 評価 | 「動いた」だけで、客先の基準で確認していない |\n| レビュー | 指摘が口頭で流れ、記録も判定も残らない |\n| 納品 | 何を作ったか、どこまで保証できるかが伝わらない |\n\nこの記事は、これらを防ぐための**客先でそのまま使える型**（シート・テンプレート・進行）を、AI仕様駆動開発とつなげてまとめたものです。\n\n:::message\n**この記事の前提（前回記事から引き継ぐ原則）**\n1. 仕様は `.md` で残す（口頭ではなく、読み返せる文書で）\n2. エラー・トラブルはエンジニアが直す（AIは仮説と案。判断と責任は人）\n3. 評価は人がする（AIは補助。最終判断は人と、顧客）\n:::\n\n:::message alert\n- 契約（請負・準委任など）、個人情報、秘密保持、知的財産に関わる事項は、**社内の法務・契約担当や顧客との契約書で確認**してください。この記事は法的助言ではありません。\n- Claude・Claude Code の仕様や、各種規格・ガイドラインは更新されます。**最新は公式・原典で確認**してください（末尾に一覧）。\n:::\n\n### 全体の流れ\n\n```mermaid\nflowchart LR\n  A[ヒアリング] --> B[要求を .md に整理]\n  B --> C[合意形成]\n  C --> D[AI仕様駆動開発]\n  D --> E[内部評価]\n  E --> F[顧客レビュー・受入評価]\n  F --> G[納品説明・検収]\n  G --> H[運用引継ぎ]\n  F -->|ずれ| B\n```\n\n### 対象読者\n\n- 客先や社内顧客の要望をもとに、AIを使って開発するDXエンジニア\n- ヒアリングや納品説明に苦手意識がある方\n- 仕様・評価・レビューを「記録に残る形」にしたい方\n\n### この記事の構成\n\n| 章 | テーマ |\n| :---- | :---- |\n| 1 | 人が判断する場所（役割分担） |\n| 2 | 客先で使えるヒアリングシート |\n| 3 | ヒアリング後：AIで整理し、人が確認する |\n| 4 | 合意形成の進め方（テンプレートつき） |\n| 5 | 客先案件でのAI仕様駆動開発 |\n| 6 | 評価の進め方（内部評価・受入評価） |\n| 7 | レビューの進め方（内部・顧客レビュー会） |\n| 8 | 納品説明と検収 |\n| 9 | 理解度テスト |\n\n---\n\n## 1. 人が判断する場所（役割分担）\n\n客先案件では、**AIが判断してよいこと**と**人が判断すること**を最初に分けます。\n\n| 作業 | 顧客 | DXエンジニア | AI |\n| :---- | :---- | :---- | :---- |\n| 目的・優先順位の決定 | ◎（決定者） | ○（整理・助言） | × |\n| 要求の整理・文書化 | ○（確認） | ◎ | ○（下書き） |\n| 仕様の確定 | ◎（承認） | ◎（提案） | △（案） |\n| 実装 | － | ◎（責任） | ○（実装・案） |\n| エラー・トラブル対応 | － | ◎ | ○（仮説） |\n| 受入評価・合否 | ◎ | ○（支援） | × |\n| 納品説明 | ○（聞く・質問） | ◎ | ○（資料下書き） |\n\n:::message\n**AIの出力は「下書きと案」、決めるのは人。** 顧客の承認が必要なところは、必ず顧客が承認します。\n:::\n\n---\n\n## 2. 客先で使えるヒアリングシート\n\n### 2-1. ヒアリングの考え方（Why）\n\n要求の聞き取りは、「聞けばすべて出てくる」ものではありません。要求獲得の技法ごとに、引き出せる情報の種類が異なることが体系的に整理されています（Davis et al., 2006）。また、要求獲得を「利害関係者との相互作用で、要求を発見・整理していく過程」として捉える見方もあります（Hickey & Davis, 2004）。\n\nそのため、**質問の型を決めておき、複数の観点から聞く**ことが有効です。\n\n### 2-2. 事前準備\n\n| 準備 | 内容 |\n| :---- | :---- |\n| 目的の共有 | 「今日は何を決めたいか」を事前に伝える |\n| 参加者 | 決定者・現場担当・情報システム担当（立場の違う人） |\n| 資料依頼 | 現行の帳票・手順書・データ例（個人情報は取り扱いルールを確認） |\n| 録音・AI利用 | 録音・文字起こし・AI要約の**可否を事前に確認**し、同意を得る |\n| 役割 | 進行・記録・質問の担当を分ける |\n\n### 2-3. 当日の進行（60〜90分の例）\n\n| 時間 | 内容 | ポイント |\n| :---- | :---- | :---- |\n| 5分 | 目的とゴールの確認 | 「今日決めたいこと」を共有 |\n| 15分 | 背景と課題 | なぜ今やるのか |\n| 20分 | 現状業務の確認 | 現行の流れ・困りごと・例外 |\n| 15分 | 要求・非機能・制約 | 優先順位も聞く |\n| 10分 | データ・情報管理・AI利用方針 | 扱ってよいデータの範囲 |\n| 5分 | まとめ・未決事項・次回 | 復唱して認識合わせ |\n\n### 2-4. ヒアリングシート（そのままコピーして使える）\n\n```markdown\n# ヒアリングシート\n- 案件名：\n- 日時／場所：\n- 参加者（顧客）：\n- 参加者（当方）：　進行：　記録：\n- 録音・文字起こし・AI要約の利用：☐ 同意あり　☐ 不可\n## A. 背景・目的\n| 質問 | 回答 |\n|---|---|\n| なぜ今この取り組みが必要ですか？ | |\n| 何が解決されたら「成功」ですか？（成功の姿） | |\n| 成功を測る指標はありますか？（例：時間、件数、ミス） | |\n| やらないこと（対象外）はありますか？ | |\n## B. 現状業務\n| 質問 | 回答 |\n|---|---|\n| 今の業務の流れを教えてください（誰が・何を・どの順に） | |\n| 一番時間がかかる／ミスが起きやすいのはどこですか？ | |\n| 例外・イレギュラーなケースはありますか？ | |\n| 現在使っているツール・帳票・ファイルは？ | |\n## C. 要求（やりたいこと）\n| ID | 要求（顧客の言葉で） | 優先度（M/S/C/W） | 補足 |\n|---|---|---|---|\n| R-001 | | | |\n| R-002 | | | |\n> 優先度の目安：M=必須（Must）／S=あると良い（Should）／C=できれば（Could）／W=今回はしない（Won't）\n## D. 非機能・品質（観点の例）\n| 観点 | 質問 | 回答 |\n|---|---|---|\n| 性能 | 1回で扱う件数・許容できる待ち時間は？ | |\n| 信頼性 | 止まったときの影響・許容停止時間は？ | |\n| セキュリティ | 扱う個人情報・機密は？ アクセスできる人は？ | |\n| 使用性 | 利用者は誰？ ITに慣れていますか？ | |\n| 互換性 | 使用するPC・OS・ブラウザ・ファイル形式は？ | |\n| 保守性 | 運用・修正は誰が担当しますか？ | |\n## E. データ・情報管理\n| 質問 | 回答 |\n|---|---|\n| 扱うデータの種類（個人情報・機密の有無） | |\n| データの保管場所・持ち出しルール | |\n| 外部サービス（AI・クラウド）にデータを送ってよいか | |\n| 秘密保持・情報管理の社内規程 | |\n## F. AI利用の方針\n| 質問 | 回答 |\n|---|---|\n| 開発でのAI利用（コード生成・テスト案など）に問題はありませんか？ | |\n| 顧客データをAIに入力してよい範囲は？（マスキング要否） | |\n| 成果物にAI生成物が含まれることへの要望・制約は？ | |\n## G. 制約・環境\n| 質問 | 回答 |\n|---|---|\n| 期限・マイルストーン（動かせない日付は？） | |\n| 予算の枠・体制の前提 | |\n| 使える環境（OS、ネットワーク制限、承認プロセス） | |\n| 既存システムとの連携 | |\n## H. 関係者・意思決定\n| 質問 | 回答 |\n|---|---|\n| 最終的に決める人（決定者）は誰ですか？ | |\n| 承認の流れ（誰の承認が何回必要か） | |\n| 現場の代表者は？ | |\n## I. リスク・懸念\n| 質問 | 回答 |\n|---|---|\n| 一番心配していることは？ | |\n| 過去にうまくいかなかった経験は？ | |\n## J. 未決事項・宿題\n| ID | 内容 | 担当 | 期限 |\n|---|---|---|---|\n| Q-001 | | | |\n## K. 復唱（終了前に）\n- 今日決まったこと：\n- 次回までの宿題：\n- 次回日程：\n```\n\n### 2-5. 質問のコツ\n\n| 型 | 例 | 使いどころ |\n| :---- | :---- | :---- |\n| オープン質問 | 「今の業務の流れを教えてください」 | 全体像・背景を聞く |\n| クローズ質問 | 「CSVは1日何件ですか？」 | 数値・事実を確認する |\n| 掘り下げ | 「それが起きるのはどんな時ですか？」 | 例外・困りごと |\n| 復唱 | 「つまり〜という理解で合っていますか？」 | 認識合わせ |\n| 目的の確認 | 「それができると、何が良くなりますか？」 | 手段ではなく目的を聞く |\n\n:::message alert\n**避けたい聞き方**：「〜ですよね？」（誘導）、専門用語の多用、**顧客が決められないことを、その場で決めさせる**こと（持ち帰りにして、未決事項に記録）。\n:::\n\n### 🧪 第2章 確認\n\n**Q.** 顧客が「いい感じに自動化したい」と言ったとき、どう聞き返しますか？\n\n:::details 答え例\n「『いい感じ』になったとき、今と何が変わっていますか？」「時間・件数・ミスのうち、一番減らしたいのはどれですか？」など、**成功の姿と指標**を聞き返します。\n:::\n\n---\n\n## 3. ヒアリング後：AIで整理し、人が確認する\n\n### 3-1. 進め方\n\n| 手順 | 担当 | 内容 |\n| :---- | :---- | :---- |\n| ① 記録の整形 | 人（＋AI） | ヒアリングシート・メモを整形 |\n| ② 要求候補の抽出 | AI（案） | 要求・制約・未決事項に分ける |\n| ③ 人が確認・修正 | 人 | 顧客の言葉との照合、抜け確認 |\n| ④ 顧客へ確認 | 人 | 「この理解で合っていますか」を送る |\n\n### 3-2. 情報の取り扱い（重要）\n\n- 顧客の秘密情報・個人情報は、**AIへ入力してよいか、契約・規程で確認**する\n- 入力する場合も、**マスキング**（個人名・固有名詞を置き換える）を基本にする\n- 利用するAIサービスの**データの取り扱い設定**を確認する（設定内容は各サービスの最新の規約・ドキュメントで確認）\n\n### 3-3. 整理用のプロンプト例\n\n```text\n次のヒアリングメモを、(1)要求候補 (2)制約 (3)非機能の要望 (4)未決事項 に分けて表にして。\nルール：\n- メモに書かれていないことは追加しない。推測は「推測」と明記する\n- 顧客の言葉をできるだけ残す\n- 各項目に、根拠になったメモの該当箇所を引用する\n- 曖昧な表現（いい感じ、適切に 等）は、確認が必要な質問に変換する\n<memo>\n（マスキング済みのヒアリングメモ）\n<\/memo>\n```\n\n**「メモに書かれていないことは追加しない」**が大事です。AIが親切心で要求を作ってしまう事態を防ぎます。\n\n### 3-4. 顧客への確認メールの型\n\n```text\n件名：【確認】○○ヒアリングの内容について\n○○様\n本日はお時間をいただきありがとうございました。\nお伺いした内容を、下記のとおり整理しました。認識に違いがないか、ご確認をお願いします。\n■ 決まったこと\n1. …\n■ 要望として伺ったこと（優先度は別途ご相談）\n1. …\n■ 未決事項（○月○日までにご回答をお願いします）\n1. …\n修正があれば、お知らせください。\n```\n\n---\n\n## 4. 合意形成の進め方（テンプレートつき）\n\n### 4-1. なぜ合意が重要か\n\nソフトウェア案件の成否に、要求工学の取り組みが大きく関わることが報告されています（Hofmann & Lehner, 2001）。また、関係者それぞれが「得をした」と感じられる解（Win-Win）を探る考え方が、プロジェクト管理の理論として提案されています（Boehm & Ross, 1989）。\n\nAI開発では「作るのが速い」ぶん、**認識違いのまま進むと、手戻りも一気に大きくなります。**\n\n### 4-2. 合意すべき5つのレイヤー\n\n| 合意のレイヤー | 内容 | 成果物 |\n| :---- | :---- | :---- |\n| ① 目的 | 何のために、何が成功か | 目的・成功指標 |\n| ② 範囲 | やること・やらないこと | スコープ（対象外を明記） |\n| ③ 受入基準 | どうなったら「できた」か | 受入基準（Given/When/Then） |\n| ④ 変更ルール | 変更の申請・判断・費用/期間への影響 | 変更管理表 |\n| ⑤ AI利用ルール | AIの使用範囲、データ取り扱い、人が判断する範囲 | AI利用方針 |\n\n### 4-3. 合意の進め方（5ステップ）\n\n```mermaid\nflowchart LR\n  A[論点を整理] --> B[選択肢を出す<br>メリット・デメリット]\n  B --> C[決定者を明確にする]\n  C --> D[決定を記録する]\n  D --> E[承認を取る]\n```\n\n| ステップ | やること |\n| :---- | :---- |\n| 論点整理 | 「決めること」を一覧にする（未決事項から） |\n| 選択肢提示 | 案A/案B と、それぞれのメリット・デメリット・影響（期間・費用・リスク） |\n| 決定者の明確化 | 誰が決めるかを事前に確認する |\n| 記録 | 決定事項・理由・影響を、議事録・決定記録に残す |\n| 承認 | 文書で確認（メール返信・押印・システム上の承認など、顧客の流儀に合わせる） |\n\n### 4-4. 合意事項シート（.md）\n\n```markdown\n# 合意事項シート AG-001\n- 案件名：\n- 版：1.0　状態：承認済　日付：\n- 決定者（顧客）：　作成者（当方）：\n## 1. 目的・成功指標\n- 目的：\n- 成功指標：（例：集計時間を月4時間→30分以内）\n## 2. 範囲\n| 区分 | 内容 |\n|---|---|\n| 対象（やること） | |\n| 対象外（やらないこと） | |\n## 3. 受入基準（抜粋）\n| 要求ID | 受入基準 |\n|---|---|\n| FR-001 | Given … / When … / Then … |\n## 4. 変更の扱い\n- 変更の申請：変更要求票（CR-xxx）で提出\n- 判断者：\n- 期間・費用への影響の確認方法：\n## 5. AI利用ルール\n- 開発でのAI利用範囲：（例：コード・テストの下書き）\n- 顧客データのAI入力：（例：マスキング済みのみ可）\n- 人が最終判断する事項：（例：仕様確定、評価、リリース）\n## 6. 未決事項\n| ID | 内容 | 担当 | 期限 |\n|---|---|---|---|\n## 7. 承認\n| 区分 | 氏名 | 日付 |\n|---|---|---|\n| 顧客 | | |\n| 当方 | | |\n```\n\n### 4-5. 議事録（決定事項・宿題・未決）の型\n\n```markdown\n# 議事録 MTG-003\n- 日時：　参加者：\n## 決定事項\n| ID | 内容 | 理由 | 決定者 |\n|---|---|---|---|\n## 宿題\n| ID | 内容 | 担当 | 期限 |\n|---|---|---|---|\n## 未決事項\n| ID | 内容 | 次の判断の場 |\n|---|---|---|\n```\n\n### 4-6. 変更要求票（CR）の型\n\n```markdown\n# 変更要求票 CR-001\n- 申請者：　日付：\n- 変更内容：\n- 理由・背景：\n- 影響範囲：（仕様ID、テスト、納期、費用）\n- 選択肢：案A／案B（メリット・デメリット）\n- 判断：☐ 承認　☐ 却下　☐ 保留　判断者：　日付：\n```\n\n### 4-7. 場面別の対応\n\n| 場面 | 対応の例 |\n| :---- | :---- |\n| 要望がどんどん増える | 優先度（M/S/C/W）で整理し、今回の範囲を合意。残りは次回候補へ |\n| 決定者が不在・決められない | 決定者・期限を明記し、未決のまま進めるリスクを書いて共有 |\n| 現場と管理者の意見が違う | 目的に立ち返り、選択肢の比較表で議論する |\n| 「AIなら簡単でしょ」と言われる | 速い部分（下書き）と、人の確認が必要な部分（評価・判断）を分けて説明 |\n| 口頭で追加依頼が来た | 「変更要求票に残させてください」と記録に変える |\n\n:::message alert\n**契約形態（請負・準委任など）によって、仕様変更や成果物の責任の扱いが変わります。** 合意事項と契約の整合は、契約書・法務担当に確認してください。\n:::\n\n### 🧪 第4章 確認\n\n**Q.** 「少しだけ追加で、この機能もお願いします」と口頭で頼まれたとき、最初にやることは？\n\n:::details 答え例\nその場で引き受けず、**変更要求票に記録**し、影響範囲（仕様・テスト・期間・費用）を確認してから、決定者の判断をもらいます。\n:::\n\n---\n\n## 5. 客先案件でのAI仕様駆動開発\n\n### 5-1. 顧客が読める仕様にする\n\nAI向けの詳細仕様と、顧客が読む仕様は**同じ内容を、読み手に合わせて2層**にします。\n\n| 層 | 読み手 | 内容 | 形式 |\n| :---- | :---- | :---- | :---- |\n| 顧客向け要約 | 決定者・現場 | 目的・範囲・主要機能・受入基準（業務の言葉で） | `.md`→PDF・スライド |\n| 詳細仕様 | エンジニア・AI | 要求ID・条件・例外・非機能・用語 | `docs/spec/*.md` |\n\n要求IDで、**合意事項・詳細仕様・テスト・納品物**を追跡できるようにします。\n\n| 合意事項 | 詳細仕様 | テスト | 納品物 |\n| :---- | :---- | :---- | :---- |\n| AG-001 §3 | FR-001 | TC-001〜003 | main.py |\n\n### 5-2. 客先案件用の CLAUDE.md（例）\n\n```markdown\n# 案件ルール（客先案件）\n- 仕様の正は docs/spec/ の .md。合意事項（docs/agreement/）と矛盾したら作業を止めて報告する\n- 仕様にない機能は追加しない。不明点は推測せず質問する\n- 顧客の秘密情報・個人情報を、プロンプト・ログ・コミットに含めない\n- 外部サービス・新規ライブラリの追加は、事前に人の承認を得る\n- エラーは、原因の仮説と根拠を示す。修正の適用は人の承認後\n- 完了報告は、要求IDごとに「確認方法」を添える\n```\n\n### 5-3. 開発の進め方（客先案件版）\n\n| ステップ | 内容 | 顧客との接点 |\n| :---- | :---- | :---- |\n| ① 計画 | AIに実装計画・疑問点を出させ、人がレビュー | 疑問点を顧客へ確認 |\n| ② 小さく実装 | 要求ID単位。テストも一緒に | 中間デモ（短く、頻繁に） |\n| ③ 内部評価 | 受入基準で確認（第6章） | － |\n| ④ 顧客レビュー | レビュー会（第7章） | 指摘・判定 |\n| ⑤ 修正・再評価 | 指摘を要求IDに紐づけて対応 | 再確認 |\n\n### 5-4. 顧客に説明する「AI利用の範囲」の例\n\n| 領域 | AIの使い方 | 人の責任 |\n| :---- | :---- | :---- |\n| 仕様 | 下書き・抜け確認の補助 | 確定・承認 |\n| 実装 | コード案・テスト案 | レビュー・採否・エラー対応 |\n| 評価 | 指摘の洗い出し補助 | 合否判定（顧客の受入評価を含む） |\n| ドキュメント | 下書き | 内容の確認 |\n\n**AIを使うことを隠さず、役割分担を説明する**ほうが、信頼につながります。\n\n---\n\n## 6. 評価の進め方（内部評価・受入評価）\n\n### 6-1. 評価は3段階\n\n| 段階 | 実施者 | 目的 |\n| :---- | :---- | :---- |\n| 内部評価 | DXエンジニア | 受入基準・品質を、納品前に確認する |\n| 受入評価 | **顧客** | 業務で使える状態かを確認し、合否を判断する |\n| 運用評価 | 顧客・当方 | 本番運用での問題・改善点を確認する |\n\n評価の合否は人が判断します。LLMによる評価には偏りが報告されており（Zheng et al., 2023）、人は自動化の出力を過信しやすい傾向があります（Parasuraman & Manzey, 2010）。AI支援のコードは、安全でない実装を含みやすく、書き手が安全だと思い込みやすいという報告もあります（Perry et al., 2023）。**AIの指摘は補助に使い、判断は人が行います。**\n\n### 6-2. 評価計画（.md）\n\n```markdown\n# 評価計画\n| 段階 | 何を | 誰が | いつ | 合格基準 | 証跡 |\n|---|---|---|---|---|---|\n| 内部評価 | 受入基準全件、非機能、異常系 | 当方 | 納品の○日前 | 重大な欠陥0件 | テスト結果表 |\n| 受入評価 | 業務シナリオ | 顧客担当 | ○月○日〜 | 合意した受入基準 | 判定シート |\n| 運用評価 | 実運用での問題・件数 | 顧客・当方 | 稼働後1か月 | 合意した指標 | 運用ログ |\n```\n\n### 6-3. 受入テストは「業務シナリオ」で\n\n顧客が評価しやすいよう、技術用語ではなく**業務の流れ**でシナリオを書きます。\n\n```markdown\n# 受入シナリオ AS-001（アンケート要約）\n- 対応要求：FR-001, FR-002\n- 利用者：研修担当者\n- 事前準備：サンプルCSV（data/sample.csv）\n- 手順：\n  1. CSVを選択して実行する\n  2. 画面に表示された要約を確認する\n- 確認ポイント：\n  - [ ] 5秒以内に結果が表示される\n  - [ ] 設問の数と要約の数が一致する\n  - [ ] 個人名が表示されない\n- 判定：☐ 合格　☐ 条件付き合格　☐ 不合格　　コメント：\n```\n\n### 6-4. 受入判定シート\n\n| 判定 | 意味 | 次のアクション |\n| :---- | :---- | :---- |\n| 合格 | 受入基準を満たす | 検収へ |\n| 条件付き合格 | 軽微な指摘あり。期限内に修正を条件に合格 | 修正計画を合意 |\n| 不合格 | 重大な指摘あり | 修正→再評価 |\n\n不具合は重大度（高・中・低）で分け、**対応の期限と優先順位を顧客と合意**します。\n\n### 6-5. 内部評価のチェックリスト\n\n- [ ] 受入基準すべてを実行し、結果を記録した\n- [ ] 要求IDごとにテストが対応している（トレーサビリティ）\n- [ ] 異常系・境界値を確認した\n- [ ] 個人情報・秘密情報が出力・ログに残っていない\n- [ ] 依存ライブラリの実在とライセンスを確認した\n- [ ] 実行環境（OS・版）で動作を確認した\n- [ ] モデル名・版・プロンプトを記録した\n\n---\n\n## 7. レビューの進め方（内部・顧客レビュー会）\n\n### 7-1. レビューの価値\n\nレビュー（インスペクション）が欠陥の早期発見に有効であることは古くから報告されています（Fagan, 1976）。現代のコードレビューでは、欠陥の発見に加え、**知識の共有や理解の促進**も期待されています（Bacchelli & Bird, 2013）。AIが書いた成果物でも、人がレビューする価値は変わりません。\n\n### 7-2. 2種類のレビュー\n\n| 種類 | 参加者 | 目的 | 観点 |\n| :---- | :---- | :---- | :---- |\n| 内部レビュー | 当方（可能なら別の人） | 欠陥・抜けの早期発見 | 仕様・コード・テスト・AI特有 |\n| 顧客レビュー会 | 顧客＋当方 | 期待との一致確認・判定 | 業務目的・受入基準・運用 |\n\n### 7-3. 内部レビューの観点（要約）\n\n- [ ] **仕様**：要求IDが単一・検証可能・曖昧語なし／受入基準あり／未決事項に担当と期限がある\n- [ ] **実装**：仕様と対応／仕様にない機能がない／異常系・ログ・秘密情報の扱い\n- [ ] **テスト**：全要求にテスト／期待結果が仕様から導かれている／境界・異常系\n- [ ] **AI特有**：API・ライブラリの実在／推測で埋めた仕様がない／修正の連鎖で別の箇所が壊れていない\n- [ ] **文書**：版・日付・承認者・変更履歴\n\n### 7-4. 顧客レビュー会の進行（60分の例）\n\n| 時間 | 内容 | ポイント |\n| :---- | :---- | :---- |\n| 5分 | 目的・本日の判定事項の確認 | 「今日は何を判断するか」 |\n| 15分 | デモ（業務シナリオに沿って） | 技術説明より、業務の流れで |\n| 15分 | 品質評価結果の説明 | 合格項目・課題・未対応を正直に |\n| 15分 | 質疑・指摘の記録 | その場で記録し、重大度を仮分類 |\n| 10分 | 判定・次のアクションの合意 | 合格／条件付き／不合格と、期限 |\n\n**事前に資料を配布**し、会議では「判断」に時間を使います。\n\n### 7-5. レビュー記録（.md）\n\n```markdown\n# 顧客レビュー会 記録 REV-002\n- 日時：　参加者：　進行：　記録：\n- 判定：条件付き合格\n| ID | 指摘 | 重大度 | 対応方針 | 期限 | 状態 |\n|---|---|---|---|---|---|\n| R-01 | 画面の項目名を現場の言葉に変更したい | 低 | 次回修正 | ○月○日 | 未 |\n| R-02 | 欠損データがあるとき、警告が出るようにしたい | 中 | 仕様に追加（CR-002で承認） | ○月○日 | 未 |\n```\n\n### 7-6. 指摘への向き合い方\n\n| 場面 | 対応 |\n| :---- | :---- |\n| 仕様外の要望が出た | 指摘ではなく**変更要求**として、CRで記録・判断 |\n| 仕様と違うと言われた | 合意事項・受入基準に立ち返り、どちらが正かを確認 |\n| 厳しい指摘を受けた | 事実と影響を整理し、対応案と期限を提示する |\n| その場で答えられない | 持ち帰り、宿題として記録（期限つき） |\n\n---\n\n## 8. 納品説明と検収\n\n### 8-1. 納品物一覧（チェックリスト）\n\n| 区分 | 納品物の例 | 確認 |\n| :---- | :---- | :---- |\n| 成果物 | プログラム・設定ファイル | ☐ |\n| 仕様 | 顧客向け要約、詳細仕様（版つき） | ☐ |\n| 品質 | テスト結果、品質評価レポート、既知の課題一覧 | ☐ |\n| 運用 | 手順書（起動・停止・バックアップ・障害時の連絡）、設定項目一覧 | ☐ |\n| セキュリティ | 認証情報の受け渡し方法、権限一覧、個人情報の扱い | ☐ |\n| AI関連 | 使用モデル・版・プロンプトや設定の記録、API利用・費用の見通し | ☐ |\n| 権利・ライセンス | 依存ライブラリ一覧とライセンス | ☐ |\n| 変更履歴 | 変更要求票と対応結果 | ☐ |\n\n### 8-2. 納品説明会の構成（60分の例）\n\n| 時間 | 内容 | ポイント |\n| :---- | :---- | :---- |\n| 5分 | 目的と、成功指標に対する結果 | 「最初の目的に対してどうだったか」 |\n| 15分 | 機能のデモ（業務シナリオ） | 顧客が実際に使う流れで |\n| 10分 | 品質評価の結果 | 合格・課題・基準を、正直に |\n| 5分 | 既知の課題と対応予定 | 隠さず、優先度と期限を示す |\n| 10分 | 運用・保守・引継ぎ | 誰が何をするか |\n| 5分 | AI利用についての説明 | 範囲・人の責任・今後の注意点 |\n| 10分 | 質疑・検収の確認 | 検収の流れと期限を合意 |\n\n### 8-3. 納品説明のトーク例\n\n| 場面 | 言い方の例 |\n| :---- | :---- |\n| 目的から入る | 「最初に目指したのは、月4時間かかっていた集計を30分以内にすることでした。結果として、実測で約○分になりました」 |\n| 課題を伝える | 「〇〇の場合は、現時点では対応していません。対応方針は、〇月までに△△の形で進める予定です」 |\n| AI利用の説明 | 「実装とテストの下書きにAIを使いました。仕様の確定、評価、リリースの判断は人が行っています」 |\n| 運用の注意 | 「AIサービスのモデルは更新・終了されることがあります。月1回、評価セットで動作確認をすることをお勧めします」 |\n| 断る・範囲外 | 「その機能は今回の範囲外です。変更要求として整理し、期間と費用を見積もります」 |\n\n### 8-4. よくある質問と回答の型\n\n| 質問 | 回答の型 |\n| :---- | :---- |\n| 「AIが間違えることはありませんか？」 | あります。だから、人が評価し、重要な数字は元データと照合する運用にしています |\n| 「個人情報は大丈夫ですか？」 | 扱う範囲・マスキング・ログの方針を説明し、確認記録を示す |\n| 「今後、誰が直しますか？」 | 運用体制・連絡先・保守の範囲（契約の範囲）を、文書で示す |\n| 「モデルが変わったらどうなりますか？」 | 評価セットで再評価する手順を説明し、記録（モデル名・版）を渡す |\n| 「他部署にも広げられますか？」 | 評価基準・運用ルール・前提条件を文書で示し、段階的な展開を提案 |\n\n### 8-5. 検収の流れ\n\n```mermaid\nflowchart LR\n  A[納品] --> B[顧客の受入評価]\n  B --> C{判定}\n  C -->|合格| D[検収書]\n  C -->|条件付き| E[修正・再確認]\n  C -->|不合格| F[修正・再評価]\n  E --> D\n  F --> B\n```\n\n検収の期限・方法・条件付き合格の扱いは、**事前の合意事項（第4章）と契約**に沿って進めます。\n\n### 8-6. 納品説明資料（.md）のひな形\n\n```markdown\n# 納品説明 v1.0\n## 1. 目的と結果\n- 目的：　成功指標：　結果（実測）：\n## 2. 成果物\n（納品物一覧）\n## 3. 品質評価の結果\n| 観点 | 基準 | 結果 | 判定 |\n|---|---|---|---|\n## 4. 既知の課題と対応予定\n| ID | 内容 | 影響 | 対応方針 | 期限 |\n|---|---|---|---|---|\n## 5. 運用・保守\n- 連絡先：　障害時の対応：　バックアップ：　定期確認：\n## 6. AI利用について\n- 使用範囲：　人の責任：　モデル・版の記録：　変更時の注意：\n## 7. 今後の提案\n```\n\n### 8-7. 納品後のフォロー\n\n- 稼働後1か月に運用評価（問題件数・利用状況・改善要望）\n- 変更要求は CR で管理し、評価セットで再評価\n- AIモデルの更新・終了や、API仕様の変更に備え、**年に数回は動作確認**する（頻度は案件に応じて決める）\n\n---\n\n## 9. 理解度テスト\n\n先に自分で答えを考えてから、答えを開いてください（Roediger & Karpicke, 2006：思い出す作業が定着を助ける）。\n\n**Q1.** ヒアリングで「いい感じに」と言われたとき、何を聞き返しますか？ **Q2.** 合意しておく5つのレイヤーを挙げてください。 **Q3.** 顧客データをAIに入力する前に確認することを2つ挙げてください。 **Q4.** 受入評価を顧客が行う理由は？ **Q5.** 顧客レビュー会で、仕様外の要望が出たときの扱いは？ **Q6.** 納品説明で「AIが間違えることは？」と聞かれたときの答え方は？ **Q7.** 「AIの指摘だけで合否を決めない」理由を、研究を1つ挙げて説明してください。\n\n:::details 解答例\n**A1.** 成功の姿と指標（何がどう変わればよいか、時間・件数・ミスなど）。 **A2.** 目的／範囲／受入基準／変更ルール／AI利用ルール。 **A3.** 契約・社内規程で入力が許されるか、マスキングの要否、サービスのデータ取り扱い設定。 **A4.** 業務で使えるかを判断できるのは顧客であり、合否の責任も顧客側にあるため。 **A5.** 指摘ではなく変更要求として、CRに記録し、影響を確認して決定者が判断する。 **A6.** 間違うことはある。だから人が評価し、重要な数字は元データと照合する運用にしている、と事実と運用で答える。 **A7.** LLMによる評価には偏りが報告されている（Zheng et al., 2023）。人は自動化の出力を過信しやすい（Parasuraman & Manzey, 2010）。\n:::\n\n---\n\n## まとめ\n\n| 場面 | 型 | 人が判断すること |\n| :---- | :---- | :---- |\n| ヒアリング | ヒアリングシート | 何を聞き、何を要求とするか |\n| 整理 | AIで整理→人が確認 | 要求の採否、抜けの確認 |\n| 合意形成 | 合意事項シート・議事録・CR | 決定と承認 |\n| 開発 | AI仕様駆動開発 | 仕様確定、エラー対応 |\n| 評価 | 内部評価→受入評価 | 合否 |\n| レビュー | 内部レビュー・顧客レビュー会 | 指摘の扱いと判定 |\n| 納品 | 納品説明・検収 | 責任範囲の説明と合意 |\n\nAIで開発が速くなるほど、**聞く・合意する・評価する・説明する**ところが、エンジニアの価値になります。まずは次の案件の1回目のヒアリングで、ヒアリングシートを使ってみてください。\n\n---\n\n## 参考文献\n\n### 公式ドキュメント（最新を確認してください）\n\n- Claude Code: [https://docs.claude.com/en/docs/claude-code/overview](https://docs.claude.com/en/docs/claude-code/overview)\n- プロンプトエンジニアリング概要: [https://docs.claude.com/en/docs/build-with-claude/prompt-engineering/overview](https://docs.claude.com/en/docs/build-with-claude/prompt-engineering/overview)\n- Claude API: [https://docs.claude.com](https://docs.claude.com)\n\n### 規格・ガイドライン（版と本文は原典で確認）\n\n- ISO/IEC/IEEE 29148 — Requirements engineering（ステークホルダー要求・要求の書き方）\n- ISO/IEC 25010 — Product quality model（非機能の観点）\n- ISO/IEC/IEEE 12207 — Software life cycle processes（受入・検証の位置づけ）\n- ISO/IEC/IEEE 29119 — Software testing\n- ISO/IEC 20246 — Work product reviews／IEEE 1028 — Software reviews and audits\n- 総務省・経済産業省「AI事業者ガイドライン」（版は要確認）\n- IPA「ユーザのための要件定義ガイド」（版は要確認）\n- 経済産業省「情報システム・モデル取引・契約書」（版は要確認）\n\n### 査読済み論文\n\n:::message\n- 論文は「考え方の背景」として引用しています。論文の結果が、個別の案件での効果を保証するものではありません。\n- 巻号・ページ・発表先、規格・ガイドラインの版は、投稿前に原典で確認してください。\n- シート・テンプレートは雛形です。**顧客・契約・社内規程に合わせて調整**してください。契約や法務に関する判断は、必ず担当部門に確認してください。\n- **国内の査読済み論文**は、情報処理学会論文誌・J-STAGE などで「要求獲得」「合意形成」「ソフトウェアレビュー」を検索して追補してください。確認できない題名は載せていません。\n:::\n"}, {"id": "a5", "no": "⑤", "short": "法人研修：規格マップ×日本の規程×SESの仕様書（金融・保険）", "kind": "研修資料⑤", "title": "法人研修資料｜ISO/IEC規格マップ × 日本の規程 × SESで使える仕様書の書き方", "md": "## 〜金融・保険サンプル（理由・意図つき）／AI仕様駆動開発に対応〜\n\nうさうさ研修工房　／　対象：SESエンジニア、DXエンジニア、新人〜中堅　／　想定時間：1日（約6時間）または半日×2回\n\n---\n\n## 0. この資料の使い方と注意\n\n### 0-1. ゴール\n\n| # | できるようになること |\n|---|---|\n| 1 | 国際規格（ISO/IEC）と日本の規程・ガイドラインの**位置づけと使い分け**を説明できる |\n| 2 | IT企画から要件定義、設計、テスト、納品までの**成果物の流れ**を説明できる |\n| 3 | SESの立場で、**曖昧な仕様を質問・確認して、書面に残せる** |\n| 4 | **理由・意図つき**の仕様書を、金融・保険の題材で書ける |\n| 5 | Claude Code などのAIに仕様を渡すとき、**人が判断する場所**を決められる |\n\n### 0-2. この資料のサンプルについて（重要）\n\n:::message alert\n- サンプル（振込依頼受付、保険金請求受付）は、**研修用の架空の例**です。実在の金融機関・保険会社の仕様ではありません。\n- **数値（金額上限、時刻、日数、桁数、稼働率など）はすべて例**です。実案件では、顧客の業務ルール・社内規程・契約で決まります。\n- 法令・監督指針・業界基準は、**改正されます。必ず発行元の最新版で確認**してください。法的な判断は、法務・コンプライアンス担当に確認してください（この資料は法的助言ではありません）。\n- 規格の本文は有償です。ここには要点（何を扱う規格か）だけを書き、条文は引用しません。**AIに条項を「思い出させて」根拠にしない**でください。\n:::\n\n### 0-3. 資料の読み方（理由・意図）\n\nサンプルには、各項目に**「理由・意図」**を付けています。仕様書は、「何を」だけでなく「**なぜそうするか**」が分かると、次の人が判断できます。SESでは担当者が交代しやすいため、**理由・意図を残すこと自体が、品質保証**になります。\n\n---\n\n## 1. 全体像：規格・規程・成果物の関係\n\n```mermaid\nflowchart TB\n  A[国際規格<br>ISO/IEC/IEEE] --> D[自社・顧客の標準<br>開発標準・設計標準]\n  B[日本の規程・ガイドライン<br>デジタル庁・経産省・IPA・金融庁・FISC] --> D\n  C[法令・契約・社内規程] --> D\n  D --> E[案件の仕様書・設計書・テスト]\n```\n\n| 階層 | 例 | 拘束力 | 使い方 |\n|---|---|---|---|\n| 法令 | 個人情報保護法、保険業法、電子帳簿保存法 など | **守る義務** | 法務・コンプライアンスに確認 |\n| 契約・社内規程 | 顧客の開発標準、セキュリティ規程 | **契約・社内で守る** | 最優先で確認 |\n| 業界基準・ガイドライン | FISC安全対策基準、金融庁ガイドライン、デジタル庁標準ガイドライン | 対象・位置づけにより異なる | 対象かを確認して適用 |\n| 国際規格 | ISO/IEC/IEEE 29148 など | 原則は任意（契約で指定されれば拘束） | **考え方を参考**にする |\n\n**理由・意図**：規格は「共通言語」、日本の規程は「この業界・この顧客で必須の追加ルール」、契約は「この案件の約束」です。**案件で守るべき順は、通常「法令・契約・社内規程 → 業界基準 → 規格」**です（契約の指定がある場合は契約を優先）。\n\n---\n\n## 2. ISO/IEC 規格マップ（AI仕様駆動開発で参照する規格の早見表）\n\n### 2-1. まず押さえる3つ\n\n| 優先 | 規格 | 一言で | 使いどころ | 理由・意図 |\n|---|---|---|---|---|\n| 1 | ISO/IEC/IEEE 29148 | 要求工学（要求の書き方・良い要求の特性） | 要求文の点検 | 曖昧な要求が、手戻りの最大の原因だから |\n| 2 | ISO/IEC 25010 | 製品品質モデル（品質特性） | 非機能要求の抜け確認、評価軸 | 機能以外の要求は、聞かれないと出てこないから |\n| 3 | ISO/IEC/IEEE 29119 | ソフトウェアテスト規格群 | テスト計画・設計・文書・技法 | 「テストした」ことを説明可能にするため |\n\n### 2-2. 工程別マップ\n\n| 工程 | 規格 | 概要（要点のみ） | 成果物との対応 |\n|---|---|---|---|\n| 全体枠組み | ISO/IEC/IEEE 12207 | ソフトウェアライフサイクルプロセス | 工程ごとの成果物・記録 |\n| 全体枠組み | ISO/IEC/IEEE 15288 | システムライフサイクルプロセス | システム全体の視点 |\n| 要求 | ISO/IEC/IEEE 29148 | 要求工学 | 要求仕様書、ステークホルダー要求 |\n| 品質要求 | ISO/IEC 25030 | 品質要求の枠組み | 非機能要求 |\n| 設計 | ISO/IEC/IEEE 42010 | アーキテクチャ記述 | 基本設計書（構成・観点・ステークホルダー） |\n| テスト | ISO/IEC/IEEE 29119 | テストの概念・プロセス・文書・技法 | テスト計画書、ケース、結果報告 |\n| 品質評価 | ISO/IEC 25010／25040／25023 | 品質モデル／評価プロセス／測定 | 品質評価レポート |\n| レビュー | ISO/IEC 20246 | 成果物レビュー | レビュー記録 |\n| 情報セキュリティ | ISO/IEC 27001／27002 | 情報セキュリティ管理／管理策 | セキュリティ要件、運用ルール |\n| プライバシー | ISO/IEC 27701／29100 | プライバシー情報管理／枠組み | 個人情報の取り扱い設計（適用は要確認） |\n\n### 2-3. AIに関わる規格\n\n| 規格 | 概要（要点のみ） | 使いどころ |\n|---|---|---|\n| ISO/IEC 22989 | AIの概念と用語 | 用語の統一 |\n| ISO/IEC 42001 | AIマネジメントシステム | AI利用の管理体制・責任分担 |\n| ISO/IEC 23894 | AIのリスクマネジメントの手引き | AI利用リスクの洗い出し |\n| ISO/IEC 5338 | AIシステムのライフサイクル | モデル・データ・再評価の工程 |\n| ISO/IEC 25059 | AIシステムの品質モデル | AI出力の品質観点（版・適用は要確認） |\n\n---\n\n## 3. 日本の規程・ガイドライン（デジタル庁ほか）\n\n### 3-1. 一覧（案件で出会いやすいもの）\n\n| 分類 | 名称 | 発行元 | 概要（要点のみ） | 使いどころ |\n|---|---|---|---|---|\n| 政府情報システム | **デジタル社会推進標準ガイドライン群**（DS-100 デジタル・ガバメント推進標準ガイドライン ほか） | デジタル庁 | サービス・業務改革と政府情報システムの整備・管理の手続・手順。企画、要件定義、調達、設計・開発、運用などを扱う | 官公庁案件、自治体案件の進め方 |\n| 政府情報システム | DS-120 実践ガイドブック | デジタル庁 | 標準ガイドラインの実務ノウハウ・ひな形（Informative） | 企画書・要件定義のひな形の参考 |\n| 政府情報システム | DS-920 生成AIの調達・利活用に係るガイドライン | デジタル庁 | 生成AIの調達・利活用のリスク管理 | 生成AIを使う官公庁案件（版は要確認） |\n| 非機能 | **非機能要求グレード** | IPA | 非機能要求を6大項目（可用性、性能・拡張性、運用・保守性、移行性、セキュリティ、システム環境・エコロジー）で整理 | 非機能要求のヒアリング・合意 |\n| 要件定義 | ユーザのための要件定義ガイド | IPA | ユーザ側の要件定義の進め方 | 要件定義の質問・合意形成 |\n| 工程・用語 | 共通フレーム（SLCP-JCF） | IPA | ソフトウェアライフサイクルの共通の工程・用語（版は要確認） | 工程・成果物の用語統一 |\n| 契約 | 情報システム・モデル取引・契約書 | 経済産業省 | システム開発契約の考え方・雛形 | 契約形態・変更管理の理解（法務確認） |\n| DX | DX推進指標／デジタルガバナンス・コード | 経済産業省 | DXの自己診断・経営の観点 | IT企画の背景整理 |\n| セキュリティ | サイバーセキュリティ経営ガイドライン | 経済産業省・IPA | 経営者向けのセキュリティ対策 | セキュリティ方針の背景 |\n| AI | AI事業者ガイドライン | 総務省・経済産業省 | AI開発・提供・利用の指針 | AI利用方針（版は要確認） |\n| 金融 | **金融分野におけるサイバーセキュリティに関するガイドライン** | 金融庁 | 金融機関のサイバーセキュリティ管理態勢（ガバナンス、特定、防御、検知、対応・復旧、サードパーティ管理など） | 金融案件のセキュリティ要件 |\n| 金融 | 金融機関等コンピュータシステムの安全対策基準 | FISC | 開発・導入・運用の安全対策基準と解説 | 金融案件の設計・運用要件 |\n| 個人情報 | 個人情報保護法・各ガイドライン | 個人情報保護委員会ほか | 個人情報の取扱いのルール | 個人情報を扱う全案件 |\n| 保険 | 保険業法、保険会社向けの総合的な監督指針 ほか | 金融庁 | 保険会社の監督・管理態勢 | 保険案件の背景（法務確認） |\n\n### 3-2. 使い分けのポイント（理由・意図）\n\n| 場面 | 先に見るもの | 理由・意図 |\n|---|---|---|\n| 官公庁・自治体の案件 | デジタル社会推進標準ガイドライン群 | 工程・成果物・調達の「決まり」が文書化されているため |\n| 民間の基幹・業務システム | 非機能要求グレード、共通フレーム | 顧客と**同じ表**で非機能を合意できるため |\n| 金融機関の案件 | 金融庁GL、FISC基準、顧客の開発標準 | 顧客が従う基準が、そのまま要件になるため |\n| 保険会社の案件 | 顧客の開発標準＋個人情報・保険関連の規程 | 要配慮個人情報（健康情報など）を扱いやすいため（扱いは法務に確認） |\n| 生成AIを使う案件 | AI事業者ガイドライン、顧客のAI利用規程、DS-920（政府案件） | AI利用の可否・範囲は、顧客規程が先に決まるため |\n\n:::message\n**どの基準が適用されるかは、顧客が決めます。** 最初のヒアリングで「**貴社で守るべき開発標準・セキュリティ基準・AI利用規程は何ですか？**」を必ず聞きます。\n:::\n\n### 3-3. 確認した事実（2026年10月時点の公開情報）\n\n- デジタル庁は、ガイドライン群の名称を「デジタル・ガバメント推進標準ガイドライン群」から「デジタル社会推進標準ガイドライン群」に変更しています（政府内部の手続を扱う文書は従来の名称を継続）。**DS-100 は 2026年6月12日に最終改定**されています。\n- 金融庁の「金融分野におけるサイバーセキュリティに関するガイドライン」は2024年10月に公表され、**2025年7月に一部改正**されています。\n- 内容は変わり続けます。**案件で使う前に、必ず発行元の最新版を確認**してください。\n\n---\n\n## 4. システム開発の全体像と成果物（ソフトウェアデザイン含む）\n\n### 4-1. 日本の現場の「工程」と国際規格の対応\n\n| 日本の現場の呼び方 | 内容 | 主な成果物 | 国際規格の観点 |\n|---|---|---|---|\n| IT企画（構想） | 課題・目的・効果・実現方針 | 企画書、課題整理表 | 12207（企画・取得）、15288 |\n| 要件定義 | 業務・機能・非機能の要求を確定 | 要件定義書、業務フロー、非機能要求 | 29148、25010 |\n| 基本設計（外部設計） | 画面・帳票・IF・DB概要 | 基本設計書、画面設計、IF設計 | 42010、12207（設計） |\n| 詳細設計（内部設計） | 処理ロジック・DB詳細 | 詳細設計書、テーブル定義 | 12207（詳細設計） |\n| 実装（製造） | コーディング・単体テスト | ソースコード、単体テスト結果 | 29119 |\n| 結合テスト | モジュール間・IF | 結合テスト仕様・結果 | 29119 |\n| システムテスト | 全体・非機能 | システムテスト仕様・結果 | 29119、25010 |\n| 受入（ユーザテスト） | 業務で使えるか | 受入テスト仕様・結果、検収書 | 12207（受入）、29119 |\n| 移行・運用 | 本番化・運用 | 移行計画、運用設計書 | 12207（運用・保守） |\n\n```mermaid\nflowchart LR\n  A[IT企画] --> B[要件定義]\n  B --> C[基本設計]\n  C --> D[詳細設計]\n  D --> E[実装・単体]\n  E --> F[結合テスト]\n  F --> G[システムテスト]\n  G --> H[受入]\n  H --> I[運用]\n  B -.対応.-> H\n  C -.対応.-> G\n  D -.対応.-> F\n```\n\n**理由・意図（V字の考え方）**：左側（設計）の成果物ごとに、右側（テスト）が対応します。**要件定義の受入基準が、受入テストの元**になります。要件が曖昧なままだと、最後の受入で揉めます。\n\n### 4-2. ソフトウェアデザイン（設計）で書くこと\n\nアーキテクチャの記述は、「誰の・どんな関心事に対して・どの視点で説明するか」を明確にする考え方があります（42010）。実務では次のように整理できます。\n\n| 設計の視点 | 書くこと | 理由・意図 |\n|---|---|---|\n| 全体構成 | システム構成図、境界、外部システム | 影響範囲と責任範囲を揃えるため |\n| 機能構成 | 機能一覧、処理の流れ | 要件とのトレース（漏れ・過剰の確認） |\n| データ | ER図、データ項目、保持期間、個人情報の有無 | 後から変えにくく、法令・監査に直結するため |\n| インターフェース | 入出力項目、プロトコル、エラー時の挙動 | 結合時の手戻りを減らすため |\n| 品質・非機能 | 性能・可用性・セキュリティ・運用の設計方針 | 要件を「どう実現するか」の根拠 |\n| 設計判断 | 採用理由、代替案、影響（決定記録 ADR） | 後任が「なぜ」を追えるため |\n\n### 4-3. 決定記録（ADR）のひな形\n\n```markdown\n# ADR-001 重複送信の防止方式\n- 状態：承認済　日付：（日付）　決定者：（氏名）\n- 背景：振込依頼の二重送信による二重処理を防ぐ必要がある\n- 選択肢：A 画面側の二重クリック防止のみ／B 依頼ごとの一意な識別子で冪等にする\n- 決定：B（Aは補助として併用）\n- 理由・意図：通信再送・画面の再読込でも二重にならないよう、サーバ側で保証したい\n- 影響：API、DB（識別子の一意制約）、テスト（再送ケース）\n```\n\n---\n\n## 5. IT企画（企画フェーズ）の書き方\n\n### 5-1. 企画フェーズの目的\n\nIT企画は、「**何のために、何を、どの範囲で、どの方法で実現するか**」を、投資判断ができる粒度で決める工程です。政府の標準ガイドラインでも、サービス・業務の企画が、要件定義や調達の前段に位置づけられています。\n\n### 5-2. IT企画書の構成と「理由・意図」\n\n| 項目 | 書くこと | 理由・意図 |\n|---|---|---|\n| 背景・課題 | 現状の問題（数値・事実で） | 投資の必要性を客観的に示すため |\n| 目的・ゴール | 実現したい状態 | 手段（システム）が目的化しないように |\n| 効果・KPI | 時間削減、誤り削減、問い合わせ削減など（測れる形） | **後で評価できる**ようにするため |\n| 対象範囲 | やること／やらないこと | 要望の増殖を防ぐため |\n| 業務・システムの現状 | 現行フロー、使用システム、データ | 現行の問題と制約の把握 |\n| 実現方式の比較 | 案A/案B（新規開発・パッケージ・改修・ノーコード 等） | 選定の根拠を残すため |\n| 体制・役割 | 発注者・開発者・利用部門・承認者 | 決定者を明確にするため |\n| スケジュール | マイルストーン、動かせない日付 | 実現可能性の確認 |\n| 概算費用・効果 | 費用の見積前提と、効果の見込み | 投資判断のため |\n| リスク・前提条件 | 法令・規程、データ、人員、外部依存 | 後で「聞いていない」を防ぐため |\n| 次工程への申し送り | 未決事項、要件定義で確認すること | 要件定義を円滑にするため |\n\n### 5-3. 方式比較の評価軸（25010の観点を使う）\n\n| 評価軸 | 見るポイント |\n|---|---|\n| 機能適合性 | 業務要求を満たせるか |\n| 性能効率性 | 件数・応答・コスト |\n| 信頼性・可用性 | 止まったときの影響 |\n| セキュリティ | 個人情報・金融/保険の規程への適合 |\n| 保守性 | 誰が運用・改修するか |\n| 検証可能性 | テスト・評価で確かめられるか |\n| 総コスト・期間 | 初期費用＋運用費用＋人員 |\n\n### 5-4. SESの立場でのIT企画への関わり方\n\n| 状況 | やること | 理由・意図 |\n|---|---|---|\n| 企画書を渡された | 目的・範囲・KPI・前提を読み、**不明点を質問票にする** | 後工程の手戻りを減らす |\n| 企画の支援を頼まれた | 事実（現状・数値）と意見（推測）を分けて書く | 判断の質を上げる |\n| 方式比較を頼まれた | 比較表と**推奨は書いても、決定は顧客** | 責任範囲の明確化 |\n| AIで下書きを作る | 顧客の秘密情報を入力しない（規程確認）。下書きは人が確認 | 情報管理・品質 |\n\n---\n\n## 6. SESで役立つ仕様書の読み方・書き方\n\n### 6-1. SESの立場の特徴\n\nSES（客先常駐）では、**仕様書は顧客側が作り、自分は読んで実装・テストする**ことが多くあります。一方で、仕様書が曖昧・不足・古い場面にも多く出会います。SESで価値が出るのは、次の力です。\n\n| 力 | 内容 |\n|---|---|\n| 読み解く力 | 仕様書の意図・前提・矛盾を読み取る |\n| 質問する力 | 曖昧な点を、**答えやすい形**で顧客に確認する |\n| 残す力 | 口頭の指示・決定を、**書面（議事録・課題票）**に残す |\n| 補完する力 | 仕様の穴を、案（選択肢）つきで提案する（決定は顧客） |\n| 説明する力 | 自分の作業・判断の根拠を、第三者に説明できる |\n\n:::message alert\n**契約形態（準委任・請負・派遣）によって、指揮命令・成果物の責任・仕様変更の扱いが異なります。** 自分の契約と業務範囲は、所属会社と契約書で確認してください（この資料は法的助言ではありません）。\n:::\n\n### 6-2. 仕様書を受け取ったときの点検（初日〜1週間）\n\n| 点検 | 質問の例 | 理由・意図 |\n|---|---|---|\n| 版・状態 | これは最新版か。承認済みか | 古い仕様で作る事故を防ぐ |\n| 目的・背景 | なぜこの機能が必要か | 迷ったときに判断できる |\n| 用語 | 用語表はあるか。同じ言葉が違う意味で使われていないか | 認識違いの防止 |\n| 要求の検証可能性 | 「適切に」「必要に応じて」はどういう条件か | テストできるようにする |\n| 例外・異常 | 失敗・欠損・重複・タイムアウトはどう扱うか | 本番障害の主因になるため |\n| 非機能 | 性能・可用性・セキュリティ・監査の要件は | 後から追加されると高コスト |\n| 他システム連携 | IFの仕様・責任・テスト環境は | 結合時の手戻り |\n| 未決事項 | 誰が・いつまでに決めるか | 進行の停滞を防ぐ |\n\n### 6-3. 質問票（Q&A管理表）のひな形\n\n| ID | 日付 | 対象（仕様書・章） | 質問 | 理由・影響 | 選択肢（案） | 回答者 | 回答 | 状態 |\n|---|---|---|---|---|---|---|---|---|\n| Q-001 | | 振込仕様 3.2 | 同一依頼の再送時の扱いは？ | 二重処理のリスク | A 拒否／B 同じ結果を返す | | | 未回答 |\n\n**理由・意図**：質問に**影響と選択肢**を付けると、顧客が答えやすく、**決定が速く・記録に残ります**。質問票は、後で「聞いた・聞いていない」を防ぐ証跡です。\n\n### 6-4. 仕様書の書き方の基本ルール（OK/NG と理由）\n\n| ルール | NG | OK | 理由・意図 |\n|---|---|---|---|\n| 主語と義務を明確に | 「限度額を確認する」 | 「システムは、1回あたりの振込額が上限（例：100万円）を超える場合、依頼を拒否しなければならない」 | 誰が何をするか、必須かが明確になり、テストにつながる |\n| 数値・単位・条件を書く | 「速やかに」 | 「受付から3秒以内に受付結果を表示する」 | 検証可能にする |\n| 例外を書く | 記載なし | 「口座が解約済みの場合は、エラーコードE105を返す」 | 本番で最も事故が起きる部分だから |\n| 1要求1文 | 「確認し、登録し、通知する」 | 3つの要求に分割 | 単一にすると追跡・テストしやすい |\n| 曖昧語を避ける | 「など」「適切に」 | 対象を列挙し、条件を書く | 解釈の違いを防ぐ |\n| 用語を統一 | 「依頼／申込／申請」が混在 | 用語表で統一 | 認識違いの防止 |\n| 理由・意図を書く | 規則のみ | 「（理由：二重処理による資金移動の誤りを防ぐため）」 | 後任・レビュアーが判断できる |\n| 追跡できるID | IDなし | FR-001 など | 設計・テスト・変更管理を結びつける |\n| 版・変更履歴 | なし | 版・日付・変更内容・承認者 | 監査・説明のため |\n\n### 6-5. SESでの「口頭指示」の扱い\n\n```text\n【確認メール（議事録代わり）の例】\n〇〇様\n本日の打合せで、次のとおり認識しました。相違があればご連絡ください。\n■ 決定：振込の再送は、同一の依頼識別子の場合、最初の結果を返す（二重処理しない）\n■ 宿題：エラーコード一覧の最新版を、○月○日までにご提供（〇〇様）\n■ 未決：メッセージ文言（△△様が確認、○月○日まで）\n```\n\n**理由・意図**：口頭の合意は、人が変わると消えます。**その日のうちに文章で確認**すると、認識違いを早く見つけられ、責任範囲の説明にも使えます。\n\n---\n\n## 7. サンプル仕様書①：金融（振込依頼の受付・確認）\n\n:::message alert\n架空の研修用サンプルです。金額・時刻・桁数・エラーコード等はすべて例です。実案件では、顧客の業務ルール・金融庁ガイドライン・FISC基準・社内規程・法令に従い、法務・コンプライアンスの確認を受けてください。\n:::\n\n### 7-1. 概要\n\n| 項目 | 内容 |\n|---|---|\n| 文書ID／版／状態 | SPEC-FIN-001／v0.3／レビュー中 |\n| 目的 | 法人顧客のインターネットバンキングで、振込依頼を受け付け、確認・承認を経て、勘定系へ連携する |\n| 対象外 | 勘定系の入出金処理本体、外為取引、定期振込 |\n| 利用者 | 依頼者（法人の担当者）、承認者（法人の上長）、行内事務担当 |\n| 前提 | 認証（多要素認証）は既存の認証基盤を利用する。口座情報は既存の口座管理システムから参照する |\n\n**理由・意図**：目的と対象外を最初に書くことで、「どこまで作るか」の認識違いを防ぎます。\n\n### 7-2. 用語\n\n| 用語 | 意味 | 理由・意図 |\n|---|---|---|\n| 依頼 | 依頼者が振込を指示した情報の単位 | 「申込」「指示」との混在を防ぐ |\n| 承認 | 承認者が依頼の実行を許可する行為 | 依頼と承認を別の人が行うため（4つの目の原則に相当する運用。顧客の規程に従う） |\n| 依頼識別子 | 依頼ごとに付与する一意のID | 二重処理の防止（冪等性） |\n| 受付時刻 | システムが依頼を受理した日時 | 取扱日・カットオフ判定の基準 |\n\n### 7-3. 機能要求\n\n| ID | 要求（システムは〜しなければならない） | 理由・意図 | 受入基準（例） | 確認事項（顧客へ） |\n|---|---|---|---|---|\n| FR-001 | 依頼者が入力した振込先口座（金融機関コード・支店コード・口座種別・口座番号）を検証する | 誤入力による誤振込を、入力時に減らすため | Given 存在しない支店コード / When 入力 / Then 「支店コードが不正です」と表示し、依頼を登録しない | 口座照合（名義確認）の要否・方式は？ |\n| FR-002 | 振込金額が、1円以上かつ依頼者の1回あたり上限（例：100万円）以下であることを検証する | 誤入力・不正利用の影響を限定するため | Given 100万円 / When 依頼 / Then 受付される。Given 100万1円 / When 依頼 / Then 拒否される | 上限は顧客ごと・利用者ごとに異なるか？ |\n| FR-003 | 同一依頼識別子の依頼が再送された場合、新たな依頼を作らず、最初の受付結果を返さなければならない | 通信再送・二重クリックで二重に振り込まれることを防ぐため | Given 同一の依頼識別子 / When 2回送信 / Then 依頼は1件のみ。2回目は最初の結果を返す | 識別子の発行主体（画面／サーバ）は？ |\n| FR-004 | 依頼者と承認者は、同一人物であってはならない | 一人で依頼から実行までできる状態を防ぐため（内部統制） | Given 依頼者=承認者 / When 承認 / Then 拒否し、エラーを表示 | 小口取引の例外承認の運用はあるか？ |\n| FR-005 | 受付時刻が当日のカットオフ時刻（例：15:00）を過ぎている場合、取扱日を翌営業日として表示しなければならない | 利用者が「いつ振り込まれるか」を誤解しないため | Given 15:01 / When 受付 / Then 取扱日が翌営業日と表示される | 営業日カレンダー・祝日・システム休止日の管理元は？ |\n| FR-006 | 承認前の依頼は、依頼者が取り消せなければならない。承認後は取り消せない | 実行済みの取引を、画面操作だけで覆さないため | Given 承認前 / When 取消 / Then 取消済みになる。Given 承認後 / When 取消 / Then 拒否 | 承認後の組戻し業務の窓口・手順は？ |\n| FR-007 | 依頼・承認・取消のすべての操作について、誰が・いつ・何をしたかの監査ログを記録しなければならない | 不正・誤操作の調査と、監査対応のため | Given 承認操作 / When 完了 / Then 利用者ID・日時・操作・対象・結果が記録される | ログの保存期間・参照権限・改ざん防止の要件は？ |\n\n### 7-4. 状態遷移\n\n```mermaid\nstateDiagram-v2\n  [*] --> 依頼中\n  依頼中 --> 承認待ち: 依頼確定\n  依頼中 --> 取消済み: 依頼者が取消\n  承認待ち --> 承認済み: 承認者が承認\n  承認待ち --> 差戻し: 承認者が差戻し\n  承認待ち --> 取消済み: 依頼者が取消\n  差戻し --> 依頼中: 依頼者が修正\n  承認済み --> 勘定系連携中: 連携開始\n  勘定系連携中 --> 完了: 連携成功\n  勘定系連携中 --> エラー: 連携失敗\n  エラー --> 勘定系連携中: 再処理（人の判断）\n```\n\n| 状態 | 説明 | 理由・意図 |\n|---|---|---|\n| エラー → 再処理 | 自動再実行せず、**人（事務担当）が判断して再処理** | 金銭の移動は、**二重実行の危険**があるため。再処理の可否は人が確認する |\n| 承認済み以降の取消不可 | 取り消せない | 画面操作のみでの取消は、勘定系の状態と不整合になる恐れがあるため |\n\n### 7-5. 画面項目・入力チェック\n\n| 項目 | 型・桁数（例） | 必須 | チェック | エラーメッセージ（例） | 理由・意図 |\n|---|---|---|---|---|---|\n| 金融機関コード | 数字4桁 | ○ | 存在チェック | 「金融機関コードが不正です」 | 誤入力を入口で止める |\n| 口座番号 | 数字7桁 | ○ | 桁数・形式 | 「口座番号は7桁の数字です」 | 同上 |\n| 振込金額 | 整数、1〜上限 | ○ | 範囲・上限 | 「振込金額が上限を超えています」 | 誤入力・不正利用の限定 |\n| 受取人名 | 全角カナ、最大48文字（例） | ○ | 使用可能文字 | 「使用できない文字が含まれています」 | 受取側システムの制約に合わせるため（実際の制約は要確認） |\n| 依頼識別子 | UUID（システム生成） | ○ | 一意性 | （画面に表示しない） | 二重処理の防止 |\n\n### 7-6. エラー処理（本番で事故が起きやすい部分）\n\n| 事象 | システムの挙動 | 利用者への表示 | 理由・意図 |\n|---|---|---|---|\n| 勘定系がタイムアウト | **成否不明**として記録し、自動再実行しない。事務担当に通知 | 「処理結果を確認中です。しばらくしてからご確認ください」 | 二重振込を防ぐ。成否は人が確認する |\n| 入力は正常だが、口座が解約済み | 依頼を登録せず、エラーを返す | 「お取扱いできない口座です」（詳細な理由は出さない） | 情報の過剰開示を避ける |\n| 同時操作（同一依頼を2人が承認） | 先に確定した承認のみ有効（排他制御） | 後続は「すでに処理済みです」 | 二重承認の防止 |\n| 認証切れ | 操作を中断し、再認証後に画面を復元 | 「再度ログインしてください」 | 不正利用の防止と利便性のバランス |\n\n### 7-7. 非機能要求（非機能要求グレードの6大項目で整理）\n\n| 大項目 | 要求の例（すべて例） | 理由・意図 |\n|---|---|---|\n| 可用性 | 稼働率 99.9%（月間）、計画停止は月1回・夜間 | 止まったときの業務影響を合意するため |\n| 性能・拡張性 | 受付応答は95%のリクエストで3秒以内。ピーク時（給料日前後）の同時利用を想定 | 利用が集中する日を前提にするため |\n| 運用・保守性 | 監視項目、障害時の連絡経路、ログの保存期間（例：○年） | 障害対応と監査に備えるため |\n| 移行性 | 既存の依頼データの移行方式、並行稼働の有無 | 切替時の事故防止 |\n| セキュリティ | 多要素認証、操作の権限分離、通信の暗号化、監査ログの改ざん防止。金融庁ガイドライン・FISC基準・顧客規程への適合を確認 | 金融機関の基準に合わせるため（具体は顧客規程に従う） |\n| システム環境・エコロジー | 対応ブラウザ・OS、設置環境 | 利用環境との整合 |\n\n### 7-8. 受入基準（抜粋）とテスト観点\n\n| テスト技法 | 観点の例（理由・意図） |\n|---|---|\n| 境界値 | 金額 0円、1円、上限、上限+1円（上限の判定ミスは重大事故） |\n| 同値分割 | 正常口座／解約口座／存在しない支店 |\n| デシジョンテーブル | 依頼者=承認者の有無 × 金額の大小 × 承認前後 |\n| 状態遷移 | 禁止遷移（承認済みの取消）が拒否されるか |\n| 異常系 | タイムアウト・再送・同時承認（二重処理が起きないか） |\n| 監査 | 全操作がログに残り、利用者ID・時刻が正確か |\n| セキュリティ | 権限なしでの承認、他人の依頼の参照、ログの改ざん |\n\n### 7-9. 未決事項\n\n| ID | 内容 | 決定者 | 期限 |\n|---|---|---|---|\n| OI-001 | 名義確認の要否 | 顧客（業務部門） | ○月○日 |\n| OI-002 | 営業日カレンダーの管理元 | 顧客（情報システム部） | ○月○日 |\n| OI-003 | タイムアウト時の再処理手順 | 顧客（事務部門） | ○月○日 |\n\n---\n\n## 8. サンプル仕様書②：保険（保険金請求の受付・進捗照会）\n\n:::message alert\n架空の研修用サンプルです。日数・書類・ステータス・支払判定の基準はすべて例です。実際の査定・支払は、保険約款・社内規程・法令に基づきます。健康情報などの要配慮個人情報の扱いは、法務・コンプライアンスの確認を受けてください。**AIに入力するデータは、マスキングと規程確認が必須**です。\n:::\n\n### 8-1. 概要\n\n| 項目 | 内容 |\n|---|---|\n| 文書ID／版／状態 | SPEC-INS-001／v0.2／レビュー中 |\n| 目的 | 契約者が、Webで保険金の請求を受け付け、書類提出と進捗照会ができるようにする。事務担当が請求内容を確認・管理できるようにする |\n| 対象外 | 査定・支払判定のロジック本体、再保険処理 |\n| 利用者 | 契約者、被保険者（代理請求を含む）、保険金事務担当 |\n| 前提 | 契約情報は既存の契約管理システムから参照する。本人確認は既存基盤を利用する |\n\n### 8-2. 用語\n\n| 用語 | 意味 | 理由・意図 |\n|---|---|---|\n| 請求 | 保険金の支払を求める手続の単位 | 「申請」「申込」と区別する |\n| 請求者 | 請求を行う者（契約者・被保険者・受取人・代理人） | 誰が請求できるかを明確にするため |\n| 不備 | 提出書類の不足・不明瞭 | 差戻しの共通語にするため |\n| 進捗ステータス | 受付／書類確認中／不備あり／確認中／支払手続中／完了／不支払 | 画面・通知・問い合わせ対応で共通の言葉にするため |\n\n### 8-3. 機能要求\n\n| ID | 要求（システムは〜しなければならない） | 理由・意図 | 受入基準（例） | 確認事項（顧客へ） |\n|---|---|---|---|---|\n| FR-101 | 請求の受付時に、契約が有効（請求対象の事由発生日に保険期間内）であることを、契約管理システムで確認する | 無効な契約への請求を、最初に判別するため | Given 失効済みの契約 / When 請求 / Then 「お手続きできません」と表示し、受付を保留にして事務担当に通知 | 「失効」「解約」「猶予期間」の扱いの定義は？ |\n| FR-102 | 請求者が、契約者・被保険者・受取人・登録済みの代理人のいずれかであることを確認する | 権限のない第三者による請求・情報照会を防ぐため | Given 登録のない第三者 / When 請求 / Then 受付せず、事務担当への連絡を案内 | 代理請求の本人確認・委任の確認方法は？ |\n| FR-103 | 請求の種類（例：入院、通院、死亡、満期など）に応じて、必要書類を画面に表示しなければならない | 書類不足による差戻しを減らすため | Given 種類=入院 / When 選択 / Then 入院の必要書類一覧が表示される | 書類の種類・数は契約商品ごとに異なるか？ |\n| FR-104 | 提出書類のファイルについて、形式（例：PDF・JPEG）・サイズ（例：1ファイル10MB以下）・ウイルス検査を確認する | 事務処理の妨げ・マルウェア混入を防ぐため | Given 20MBのファイル / When アップロード / Then 拒否し、理由を表示 | ウイルス検査の仕組み・保存先・保存期間は？ |\n| FR-105 | 同一の事由に対する重複請求を検知し、事務担当に通知しなければならない（自動拒否はしない） | 二重支払を防ぐ一方、正当な追加請求を誤って拒否しないため | Given 同一契約・同一事由の請求済み / When 再請求 / Then 受付し、重複の可能性を事務担当へ通知 | 重複の判定条件（事由日・診療機関など）は？ |\n| FR-106 | 請求の進捗ステータスを、請求者が照会できなければならない。ステータスの変更は、事務担当の操作または他システムからの連携のみで行う | 契約者の不安・問い合わせの削減、および画面からの状態改ざんの防止のため | Given 事務担当が「書類確認中」に変更 / When 契約者が照会 / Then 「書類確認中」と表示 | 通知手段（メール・SMS・郵送）と、通知文言の承認者は？ |\n| FR-107 | 不備がある場合、不備の内容と再提出の期限を、請求者に通知しなければならない | 手続の遅延を防ぎ、利用者に分かりやすくするため | Given 書類不備 / When 事務担当が不備登録 / Then 請求者に通知が送られる | 再提出期限（例：30日）の起算日と、期限後の扱いは？ |\n| FR-108 | 請求内容・書類の閲覧・変更・出力のすべてについて、利用者ID・日時・操作内容を監査ログに記録しなければならない | 個人情報（健康情報を含む）の不正閲覧の抑止と、調査のため | Given 事務担当が書類を閲覧 / When 閲覧 / Then 閲覧ログが記録される | ログの保存期間・参照権限・定期点検の頻度は？ |\n\n### 8-4. 進捗ステータスの遷移\n\n```mermaid\nstateDiagram-v2\n  [*] --> 受付\n  受付 --> 書類確認中: 事務担当が確認開始\n  書類確認中 --> 不備あり: 不備を登録\n  不備あり --> 書類確認中: 再提出\n  書類確認中 --> 確認中: 書類が揃う\n  確認中 --> 支払手続中: 支払決定（人の判断）\n  確認中 --> 不支払: 不支払決定（人の判断）\n  支払手続中 --> 完了: 支払完了\n  不支払 --> 完了: 通知完了\n```\n\n| ポイント | 理由・意図 |\n|---|---|\n| 「支払決定」「不支払決定」は**人の判断**とし、システムは自動決定しない（本サンプルの範囲） | 契約者の権利・生活に直結するため。判断の根拠と責任の所在を明確にする |\n| 不備あり→書類確認中の往復を許可 | 実務で何度も再提出が起きるため |\n\n### 8-5. 個人情報・要配慮個人情報の扱い（設計の観点）\n\n| 観点 | 要求の例（例） | 理由・意図 |\n|---|---|---|\n| 最小限の収集 | 請求に必要な項目のみ収集する | 不要な情報を持たない（漏えい時の影響を減らす） |\n| 表示のマスキング | 一覧画面では、氏名・診断名などを一部表示にし、詳細は権限者のみ | 画面の覗き見・不要な閲覧の抑止 |\n| アクセス制御 | 担当範囲に限定した参照権限、閲覧理由の記録 | 不正閲覧の抑止と調査 |\n| ログへの出力 | ログに健康情報・証券番号をそのまま出力しない | ログ経由の漏えい防止 |\n| テストデータ | 本番データを使わず、マスキング済み・架空データを使う | 開発・テスト環境での漏えい防止 |\n| AI利用 | 顧客データをAIに入力する場合は、規程確認とマスキングが前提 | 情報管理 |\n\n### 8-6. 非機能要求（6大項目で整理）\n\n| 大項目 | 要求の例（すべて例） | 理由・意図 |\n|---|---|---|\n| 可用性 | 稼働率 99.5%（月間）、災害時の復旧目標時間（例：○時間） | 災害時の請求受付の継続性を合意するため |\n| 性能・拡張性 | 画面表示3秒以内、災害後の請求集中を想定した同時利用 | 大規模災害後に請求が集中するため |\n| 運用・保守性 | 障害時の問い合わせ連絡先、書類の保存期間 | 運用と法定保存への対応（期間は要確認） |\n| 移行性 | 既存の請求データの移行、並行稼働の有無 | 切替時の事故防止 |\n| セキュリティ | 本人確認、多要素認証、書類の暗号化保存、閲覧ログ。顧客のセキュリティ規程への適合 | 健康情報等の保護 |\n| システム環境 | スマートフォン対応、アクセシビリティ | 高齢の契約者の利用を考慮 |\n\n### 8-7. テスト観点\n\n| 技法 | 観点の例（理由・意図） |\n|---|---|\n| 同値分割 | 請求者の種類（契約者／被保険者／受取人／代理人／第三者） |\n| デシジョンテーブル | 契約状態 × 請求種類 × 書類の充足 → 受付可否・案内 |\n| 状態遷移 | 禁止遷移（完了→書類確認中）が拒否されるか |\n| 境界値 | ファイルサイズ（例：10MB、10MB+1）、再提出期限の初日・最終日 |\n| 異常系 | アップロード中断、重複請求、契約管理システムの停止 |\n| セキュリティ | 他人の請求の参照（IDOR）、権限外の閲覧、ログの内容 |\n| 運用 | 不備通知の文言・日付の正確性 |\n\n---\n\n## 9. AI仕様駆動開発での使い方（Claude Code・Claude API）\n\n### 9-1. 原則（再掲）\n\n1. 仕様は `.md` で渡す（版・状態・承認者つき）\n2. エラー・トラブルは**エンジニアが直す**（AIは仮説と案）\n3. 評価は**人がする**（AIは補助）\n\n### 9-2. 金融・保険案件向けの CLAUDE.md（例）\n\n```markdown\n# 案件ルール（金融・保険）\n- 仕様の正は docs/spec/ とする。仕様と矛盾する場合は作業を止めて報告する\n- 顧客データ・個人情報・認証情報を、プロンプト・ログ・コミットに含めない\n- テストデータは架空データのみ。本番データを使わない\n- 金額・日付・端数処理は、仕様の指定どおりにし、独自に解釈しない。不明点は質問にする\n- 二重処理・排他制御・再送の扱いは、仕様に明記された方式以外を採用しない\n- 外部サービス・新規ライブラリの追加は、人の承認を得る\n- エラーは原因の仮説と根拠を示し、修正の適用は人の承認後に行う\n- 規格・法令の条文を記憶で引用しない。根拠が必要な場合は人が原典を確認する\n```\n\n### 9-3. AIに仕様の穴を探させるプロンプト（決定はさせない）\n\n```text\ndocs/spec/ を、次の観点で点検して、問題点を表で出して。\n観点：曖昧語／検証可能性／例外・異常系の記載／状態遷移の抜け／\n      二重処理・再送・同時操作／金額・日付の端数・境界／\n      監査ログ／個人情報の扱い／非機能（6大項目）の抜け\n形式：箇所・指摘・理由・質問案（顧客に確認する文面）\nルール：修正はしない。決定（どうするか）は書かない。選択肢は出してよいが推奨は書かない。\n```\n\n### 9-4. 人が判断すること（金融・保険で特に）\n\n| 判断 | 理由 |\n|---|---|\n| 金額・限度額・端数の扱い | 金銭に直結し、誤りの影響が大きい |\n| 二重処理・再処理の可否 | 自動化の誤りが、取り返しのつかない結果になる |\n| 支払・不支払など権利に関わる判断 | 契約者の権利・生活に影響 |\n| 個人情報・要配慮個人情報の扱い | 法令・規程・信用に直結 |\n| リリース可否 | 品質ゲートの判定と責任 |\n\n---\n\n## 10. レビュー観点（金融・保険の追加観点つき）\n\n### 10-1. 共通観点\n\n- [ ] 要求は単一・検証可能・追跡可能（ID）で、曖昧語がない\n- [ ] 例外・異常系・状態遷移が書かれている\n- [ ] 非機能要求（6大項目）の抜けがない\n- [ ] 用語が統一され、理由・意図が書かれている\n- [ ] 版・状態・承認者・変更履歴がある\n\n### 10-2. 金融・保険の追加観点\n\n- [ ] 金額・日付・端数処理・営業日の扱いが明確か\n- [ ] 二重処理・再送・同時操作（排他制御）の扱いが明確か\n- [ ] 依頼者と承認者の分離（内部統制）が考慮されているか\n- [ ] 監査ログ（誰が・いつ・何を）の要件があるか\n- [ ] 個人情報・要配慮個人情報の最小化・マスキング・アクセス制御があるか\n- [ ] 障害時の縮退・業務継続・手作業での代替が考慮されているか\n- [ ] 顧客の規程（開発標準・セキュリティ・AI利用）への適合を確認したか\n- [ ] テストデータに本番データが含まれていないか\n\n---\n\n## 11. 研修の進め方（法人研修用）\n\n### 11-1. 時間割（1日・約6時間の例）\n\n| 時間 | 内容 | 形式 |\n|---|---|---|\n| 30分 | 導入：ゴールと、サンプルの注意（0章） | 講義 |\n| 45分 | 規格マップ・日本の規程（1〜3章） | 講義＋クイズ |\n| 45分 | 工程と成果物、設計の書き方（4章） | 講義＋ミニ演習 |\n| 40分 | IT企画（5章） | 講義＋演習（企画書の骨子作成） |\n| 60分 | SESでの仕様書の読み方・書き方（6章） | 講義＋演習（質問票作成） |\n| 90分 | サンプル仕様書（7〜8章）の読み解きとレビュー | グループ演習 |\n| 40分 | AI仕様駆動開発（9章）、レビュー観点（10章） | 講義＋演習 |\n| 30分 | まとめ・理解度テスト | 確認 |\n\n### 11-2. 演習\n\n| 演習 | 内容 | 狙い |\n|---|---|---|\n| 演習1 | FR-002（金額上限）の要求文を、曖昧な文から書き直す | 要求文の書き方 |\n| 演習2 | 仕様書（金融サンプル）から、顧客への質問票を10件作る | 質問する力 |\n| 演習3 | 保険サンプルの状態遷移から、禁止遷移のテストケースを作る | テスト設計 |\n| 演習4 | 理由・意図が書かれていない要求に、理由・意図を補う | 意図を言語化する力 |\n| 演習5 | AIに仕様の穴を探させ、**人が採否を判断**する（採否の理由を記録） | 人の判断 |\n\n### 11-3. 理解度テスト\n\n**Q1.** 案件で守るべき基準の優先順は、通常どうなりますか？\n**Q2.** SESで、口頭の指示を受けたとき、最初にやることは？\n**Q3.** 「速やかに処理すること」を、検証可能な要求に直してください。\n**Q4.** 金融サンプルで、勘定系のタイムアウト時に「自動再実行しない」理由は？\n**Q5.** 保険サンプルで、支払・不支払の決定を人の判断にしている理由は？\n**Q6.** 非機能要求グレードの6大項目を挙げてください。\n**Q7.** 規格の条項を、AIに記憶で引用させてはいけない理由は？\n**Q8.** 仕様書に「理由・意図」を書く利点は？\n\n:::details 解答例\n**A1.** 法令・契約・社内規程 → 業界基準 → 規格（契約で指定があれば契約を優先）。\n**A2.** その日のうちに、確認メール（議事録）で文章に残し、相違の確認を依頼する。\n**A3.** 「受付から3秒以内に結果を表示する」など、測れる条件にする。\n**A4.** 成否が不明な状態で再実行すると、二重振込になる恐れがあるため。人が確認して再処理する。\n**A5.** 契約者の権利・生活に直結し、判断根拠と責任の所在を明確にする必要があるため。\n**A6.** 可用性／性能・拡張性／運用・保守性／移行性／セキュリティ／システム環境・エコロジー。\n**A7.** AIは条項を誤って説明することがあり、誤った根拠が仕様に入り込むため。根拠は人が原典で確認する。\n**A8.** 後任やレビュアーが判断でき、担当交代や監査・変更時に説明できるため。\n:::\n\n---\n\n## 12. 参考・確認先\n\n### 12-1. 日本の規程・ガイドライン（最新は必ず発行元で確認）\n\n- デジタル庁「デジタル社会推進標準ガイドライン」（DS-100、DS-120、DS-920 ほか）：https://www.digital.go.jp/resources/standard_guidelines\n- IPA（情報処理推進機構）「非機能要求グレード」「ユーザのための要件定義ガイド」「共通フレーム」：https://www.ipa.go.jp\n- 経済産業省「情報システム・モデル取引・契約書」「DX推進指標」「サイバーセキュリティ経営ガイドライン」：https://www.meti.go.jp\n- 総務省・経済産業省「AI事業者ガイドライン」\n- 金融庁「金融分野におけるサイバーセキュリティに関するガイドライン」：https://www.fsa.go.jp\n- FISC「金融機関等コンピュータシステムの安全対策基準・解説書」（会員向け・有償の可能性あり）：https://www.fisc.or.jp\n- 個人情報保護委員会：https://www.ppc.go.jp\n\n### 12-2. 国際規格（版と本文は原典で確認）\n\n- ISO：https://www.iso.org／IEC：https://www.iec.ch／IEEE Standards：https://standards.ieee.org\n- 日本産業標準調査会（JISC）／日本規格協会（JSA）：JIS版の確認\n\n### 12-3. 論文（考え方の背景。巻号・発表先は原典で確認）\n\n- Davis et al. (2006) 要求獲得技法の有効性（RE'06）\n- Hofmann & Lehner (2001) 要求工学とプロジェクトの成功（IEEE Software）\n- Fagan (1976) インスペクション（IBM Systems Journal）／Bacchelli & Bird (2013) コードレビュー（ICSE）\n- Kuhn et al. (2004) 組み合わせテスト（IEEE TSE）\n- Parasuraman & Manzey (2010) 自動化バイアス（Human Factors）\n- Zheng et al. (2023) LLM-as-a-Judge（NeurIPS Datasets and Benchmarks）\n- Roediger & Karpicke (2006) テスト効果（Psychological Science）\n\n### 12-4. 要確認事項（講師・受講者へ）\n\n- サンプルの数値・コード・エラーメッセージは架空の例です。\n- 規格の番号・題名・版、国内ガイドラインの名称・版、法令の内容は、使用前に発行元で最新を確認してください。\n- 国内の査読済み論文は、情報処理学会論文誌・J-STAGE などで「要求工学」「ソフトウェアテスト」「システム開発の品質」を検索して追補してください（確認できない題名は載せていません）。\n- 契約形態・法令・個人情報の判断は、所属会社の法務・契約担当に確認してください。\n"}, {"id": "a6", "no": "⑥", "short": "ISO/IEC 規格マップ（早見表）", "kind": "参照シート⑥", "title": "ISO/IEC 規格マップ｜AI仕様駆動開発で参照する規格の早見表", "md": "うさうさ研修工房／記事シリーズ（仕様駆動開発・客先案件・テスト設計）共通の参照シートです。\n\n> **使い方の注意**\n> - 規格は**版（発行年）と本文を原典で確認**してください。本文は有償で、ここには要点（何を扱う規格か）だけを書いています。\n> - 規格の条項番号や文言を、AIに「引用」させないでください。AIは規格の内容を誤ることがあります。**根拠にする場合は、人が原典で確認**します。\n> - 規格の考え方を参考にすることと、**規格に準拠していると主張すること**は別です。準拠の主張には、組織のプロセス整備や第三者の確認が必要になる場合があります。\n> - JIS版（国内規格）の有無・対応する版は、日本産業標準調査会（JISC）などで確認してください。\n\n---\n\n## 1. まず押さえる3つ\n\n| 優先 | 規格 | 一言で | 主な使いどころ |\n|---|---|---|---|\n| 1 | ISO/IEC/IEEE 29148 | 要求工学（要求の書き方・良い要求の特性） | 仕様書の要求文の点検 |\n| 2 | ISO/IEC 25010 | 製品品質モデル（品質特性の体系） | 非機能要求の抜け確認、評価軸 |\n| 3 | ISO/IEC/IEEE 29119 | ソフトウェアテストの規格群 | テスト計画・設計・文書・技法 |\n\n---\n\n## 2. 工程別マップ\n\n| 工程 | 規格 | 概要（要点のみ） | 記事での使いどころ |\n|---|---|---|---|\n| 全体の枠組み | ISO/IEC/IEEE 12207 | ソフトウェアライフサイクルプロセス | 要求→設計→実装→検証→運用の成果物と記録の考え方 |\n| 全体の枠組み | ISO/IEC/IEEE 15288 | システムライフサイクルプロセス | システム全体（ハード・運用を含む）の視点 |\n| ヒアリング・要求 | ISO/IEC/IEEE 29148 | 要求工学。ステークホルダー要求、要求の記述、良い要求の特性 | ヒアリングシート、要求文のOK/NG、受入基準 |\n| 品質要求 | ISO/IEC 25030 | 品質要求の枠組み | 非機能要求の定義の手がかり |\n| 設計 | ISO/IEC/IEEE 42010 | アーキテクチャ記述 | 設計メモ・決定記録（ADR）の書き方の参考 |\n| テスト | ISO/IEC/IEEE 29119（-1〜-5） | 概念・テストプロセス・テスト文書・テスト技法など | テスト戦略、テストケース、境界値などの技法 |\n| 品質評価 | ISO/IEC 25010 | 品質特性（機能適合性、性能効率性、信頼性、セキュリティ、保守性 等） | 品質評価の観点、出荷判定 |\n| 品質評価 | ISO/IEC 25040 | 品質評価のプロセス | 評価の計画→実施→記録の流れ |\n| 品質評価 | ISO/IEC 25023 | 製品品質の測定 | 指標（メトリクス）を決めるときの参考 |\n| レビュー | ISO/IEC 20246 | 成果物レビュー | 内部レビュー・顧客レビュー会の進め方 |\n| 情報セキュリティ | ISO/IEC 27001 / 27002 | 情報セキュリティマネジメント／管理策 | 顧客データ・秘密情報の取り扱いルール |\n| プライバシー | ISO/IEC 27701 ／ 29100 | プライバシー情報管理／プライバシーの枠組み | 個人情報を扱う案件の設計（適用は要確認） |\n\n---\n\n## 3. AIに関わる規格\n\nAIを使う開発・AIを組み込むシステムでは、次の規格も参考になります。\n\n| 規格 | 概要（要点のみ） | 使いどころ |\n|---|---|---|\n| ISO/IEC 22989 | AIの概念と用語 | 顧客・チームとの用語の統一 |\n| ISO/IEC 42001 | AIマネジメントシステム | 組織としてAIを管理する枠組み（運用ルール・責任分担） |\n| ISO/IEC 23894 | AIのリスクマネジメントの手引き | AI利用のリスクの洗い出しと対応 |\n| ISO/IEC 5338 | AIシステムのライフサイクルプロセス | AI特有の工程（データ・モデル・再評価）の整理 |\n| ISO/IEC 25059 | AIシステムの品質モデル（25010の拡張） | AI出力の品質観点（適応性・頑健性など）の参考 |\n| ISO/IEC TR 24029-1 | ニューラルネットワークの頑健性評価 | 頑健性を評価する考え方の参考 |\n\n国内の動きとして、総務省・経済産業省の「AI事業者ガイドライン」も参考になります（版は要確認）。\n\n---\n\n## 4. 記事シリーズとの対応\n\n| 記事 | 主に参照した規格 |\n|---|---|\n| 仕様駆動開発×Claude Code | 29148、25010、29119、JIS X 25010（版の対応は要確認） |\n| 品質評価・テスト規格・レビュー（同記事 第8〜11章） | 25010／25040、29119、12207、42010、20246、42001 |\n| 客先案件：ヒアリング・合意・納品説明 | 29148、25010、12207、29119、20246 |\n| AI仕様駆動開発のテスト設計 | 29119、25010／25040、29148、12207、20246 |\n\n---\n\n## 5. 現場への落とし込み方\n\n### 5-1. 規格の観点を「チェックリスト」にして使う\n\n| 規格の観点 | チェックリストにするとこうなる |\n|---|---|\n| 29148（良い要求） | 各要求は、必要・曖昧でない・単一・検証可能・追跡可能か |\n| 25010（品質特性） | 機能・性能・互換性・使用性・信頼性・セキュリティ・保守性・移植性を見たか |\n| 29119（テスト） | 計画→設計→実行→報告の記録があるか。要求とテストが対応しているか |\n| 20246（レビュー） | 役割・観点・指摘の記録・判定があるか |\n| 42001／23894（AI管理） | AI利用の範囲、責任者、リスクと対応、再評価の頻度が決まっているか |\n\n### 5-2. Claude Code に「観点」で自己点検させる（規格名は根拠にしない）\n\n```text\ndocs/spec/ を、次の観点で点検して、問題点を表で出して。\n- 各要求は単一で、検証可能か（受入基準があるか）\n- 曖昧語（など／適切に／必要に応じて）がないか\n- 非機能要求（性能・信頼性・セキュリティ・保守性・互換性）の抜けがないか\n- 要求IDが重複・欠番していないか。テストと対応しているか\n注意：規格の条項番号や文言を引用しないこと。該当箇所は仕様書の本文を引用すること。\n修正はまだしないで。判定（合否）もしないこと。\n```\n\n### 5-3. 決定記録に規格を「参考」として書く場合\n\n```markdown\n## 参考にした規格（要点）\n- 品質特性の観点：ISO/IEC 25010（版：○○。原典確認者：△△、日付）\n- 要求文の点検観点：ISO/IEC/IEEE 29148（版：○○。原典確認者：△△、日付）\n```\n\n**「誰が・いつ・どの版を原典で確認したか」**を残すと、後で説明できます。\n\n---\n\n## 6. 規格を使うときの落とし穴\n\n| 落とし穴 | 対策 |\n|---|---|\n| 版の違いに気づかない | 発行年・改訂の有無を、原典または発行元で確認する |\n| 「準拠している」と書いてしまう | 「参考にしている」と書く。準拠の主張は、組織と契約で確認 |\n| AIが規格の内容を誤って説明する | 規格内容の確認は人が原典で行う。AIに条項を引用させない |\n| 規格が重すぎて回らない | まず3つ（29148・25010・29119）の観点をチェックリスト化する |\n| 顧客が規格を指定している | 契約・仕様書の指定を優先し、版と範囲を確認する |\n\n---\n\n## 7. 入手・確認先\n\n- ISO（国際標準化機構）：https://www.iso.org\n- IEC（国際電気標準会議）：https://www.iec.ch\n- IEEE Standards：https://standards.ieee.org\n- JISC（日本産業標準調査会）／日本規格協会（JSA）：JIS規格の検索・購入\n- 総務省・経済産業省：AI事業者ガイドライン\n\n**規格の番号・題名・版は、記載時点の私の知識に基づきます。** 使用前に、必ず発行元で最新を確認してください。\n"}]</script>

"# 振込依頼の受付・確認 仕様書（研修用の架空サンプル）","",
"> 金額・時刻・桁数・エラーコードはすべて例です。実案件では顧客の業務ルール・金融庁ガイドライン・FISC基準・社内規程・法令に従い、法務・コンプライアンスの確認を受けます。","",
"## 1. 概要","| 項目 | 内容 |","|---|---|",
"| 目的 | 法人顧客のインターネットバンキングで振込依頼を受け付け、確認・承認を経て勘定系へ連携する |",
"| 対象外 | 勘定系の入出金処理本体、外為取引、定期振込 |",
"| 利用者 | 依頼者（法人の担当者）、承認者（法人の上長）、行内事務担当 |",
"| 前提 | 多要素認証は既存の認証基盤を利用する。口座情報は既存の口座管理システムから参照する |","",
"## 2. 用語","| 用語 | 意味 | 理由・意図 |","|---|---|---|",
"| 依頼 | 依頼者が振込を指示した情報の単位 | 「申込」「指示」との混在を防ぐ |",
"| 承認 | 承認者が依頼の実行を許可する行為 | 依頼と承認を別の人が行うため |",
"| 依頼識別子 | 依頼ごとに付与する一意のID | 二重処理の防止（冪等性） |",
"| 受付時刻 | システムが依頼を受理した日時 | 取扱日・カットオフ判定の基準 |","",
"## FR-001 振込先口座の検証","システムは、依頼者が入力した振込先口座（金融機関コード・支店コード・口座種別・口座番号）を検証しなければならない。",
"- 理由・意図：誤入力による誤振込を、入力時に減らすため",
"- 受入基準：","  - Given 存在しない支店コード / When 入力する / Then 「支店コードが不正です」と表示し、依頼を登録しない",
"- 確認事項（顧客へ）：口座照合（名義確認）の要否と方式","",
"## FR-002 振込金額の検証","システムは、振込金額が1円以上かつ依頼者の1回あたり上限（例：100万円）以下であることを検証しなければならない。",
"- 理由・意図：誤入力・不正利用の影響を限定するため",
"- 受入基準：","  - Given 1000000円 / When 依頼する / Then 受け付ける","  - Given 1000001円 / When 依頼する / Then 「振込金額が上限を超えています」と表示し、受け付けない",
"  - Given 0円 / When 依頼する / Then 受け付けない",
"- 確認事項（顧客へ）：上限は顧客ごと・利用者ごとに異なるか","",
"## FR-003 再送時の二重処理の防止","システムは、同一依頼識別子の依頼が再送された場合、新たな依頼を作らず、最初の受付結果を返さなければならない。",
"- 理由・意図：通信の再送や二重クリックで二重に振り込まれることを防ぐため（ADR-001）",
"- 受入基準：","  - Given 同一の依頼識別子 / When 2回送信する / Then 依頼は1件のみで、2回目は最初の結果を返す",
"- 確認事項（顧客へ）：識別子の発行主体（画面／サーバ）","",
"## FR-004 依頼者と承認者の分離","システムは、依頼者と同一の利用者による承認を受け付けてはならない。",
"- 理由・意図：一人で依頼から実行までできる状態を防ぐため（内部統制）",
"- 受入基準：","  - Given 依頼者と承認者が同一 / When 承認する / Then 拒否し、エラーを表示する",
"- 確認事項（顧客へ）：小口取引の例外承認の運用があるか","",
"## FR-005 カットオフ後の取扱日","システムは、受付時刻が当日のカットオフ時刻（例：15:00）を過ぎている場合、取扱日を翌営業日として表示しなければならない。",
"- 理由・意図：利用者が「いつ振り込まれるか」を誤解しないため",
"- 受入基準：","  - Given 15:00:00 に受付 / When 確定する / Then 取扱日は当日","  - Given 15:00:01 に受付 / When 確定する / Then 取扱日は翌営業日と表示される",
"- 確認事項（顧客へ）：営業日カレンダー・祝日・システム休止日の管理元","",
"## FR-006 承認前の取消","システムは、承認前の依頼に限り、依頼者による取消を受け付けなければならない。",
"- 理由・意図：実行済みの取引を、画面操作だけで覆さないため",
"- 受入基準：","  - Given 承認待ちの依頼 / When 依頼者が取り消す / Then 取消済みになる","  - Given 承認済みの依頼 / When 依頼者が取り消す / Then 拒否する",
"- 確認事項（顧客へ）：承認後の組戻しの窓口と手順","",
"## FR-007 監査ログ","システムは、依頼・承認・取消のすべての操作について、利用者ID・日時・操作・対象・結果を監査ログに記録しなければならない。",
"- 理由・意図：不正・誤操作の調査と、監査対応のため",
"- 受入基準：","  - Given 承認操作 / When 完了する / Then 利用者ID・日時・操作・対象・結果が記録される",
"- 確認事項（顧客へ）：ログの保存期間・参照権限・改ざん防止の要件","",
"## FR-008 勘定系タイムアウト時の扱い","システムは、勘定系との連携がタイムアウトした場合、成否不明として記録し、自動で再実行してはならない。",
"- 理由・意図：成否が不明なまま再実行すると二重振込になるため。再処理の可否は事務担当（人）が確認する",
"- 受入基準：","  - Given 勘定系が応答しない / When 連携する / Then 状態を「エラー（成否不明）」にし、事務担当に通知し、再実行しない",
"- 確認事項（顧客へ）：再処理の手順と権限者（OI-003）","",
"## 3. 状態遷移","| 現在の状態 | 操作 | 次の状態 | 備考 |","|---|---|---|---|",
"| 依頼中 | 依頼確定 | 承認待ち | |","| 承認待ち | 承認者が承認 | 承認済み | 依頼者と同一は不可（FR-004） |",
"| 承認待ち | 承認者が差戻し | 差戻し | |","| 承認待ち | 依頼者が取消 | 取消済み | 承認前のみ（FR-006） |",
"| 承認済み | 連携開始 | 勘定系連携中 | 取消は不可 |","| 勘定系連携中 | 連携失敗・タイムアウト | エラー | 自動再実行しない（FR-008） |",
"| エラー | 事務担当が再処理 | 勘定系連携中 | 人の判断 |","",
"## 4. 非機能要求（非機能要求グレードの6大項目で整理。すべて例）","| 大項目 | 要求の例 | 理由・意図 |","|---|---|---|",
"| 可用性 | 稼働率99.9%（月間）、計画停止は月1回・夜間 | 止まったときの業務影響を合意するため |",
"| 性能・拡張性 | 受付応答は95%のリクエストで3秒以内。給料日前後のピークを想定 | 利用が集中する日を前提にするため |",
"| 運用・保守性 | 監視項目、障害時の連絡経路、ログの保存期間 | 障害対応と監査に備えるため |",
"| 移行性 | 既存の依頼データの移行方式、並行稼働の有無 | 切替時の事故防止 |",
"| セキュリティ | 多要素認証、権限分離、通信の暗号化、監査ログの改ざん防止 | 顧客規程・金融庁ガイドライン・FISC基準への適合を確認 |",
"| システム環境・エコロジー | 対応ブラウザ・OS | 利用環境との整合 |","",
"## 5. テスト観点","| 技法 | 観点 |","|---|---|",
"| 境界値 | 金額 0円・1円・上限・上限+1円、受付時刻 15:00:00・15:00:01 |",
"| デシジョンテーブル | 依頼者=承認者 × 金額 × 承認前後 |","| 状態遷移 | 禁止遷移（承認済みの取消）が拒否されるか |",
"| 異常系 | タイムアウト・再送・同時承認で二重処理が起きないか |","| セキュリティ | 権限なしの承認、他人の依頼の参照、ログの改ざん |","",
"## 6. 未決事項","| ID | 内容 | 決定者 | 期限 |","|---|---|---|---|",
"| OI-001 | 名義確認の要否 | 顧客（業務部門） | ○月○日 |","| OI-002 | 営業日カレンダーの管理元 | 顧客（情報システム部） | ○月○日 |","| OI-003 | タイムアウト時の再処理手順 | 顧客（事務部門） | ○月○日 |","","## 変更履歴","| 版 | 日付 | 変更内容 | 変更者 | 承認 |","|---|---|---|---|---|","| 0.1 | ○月○日 | 初版（研修用サンプル） | （氏名） | （氏名） |"
  ].join("\n")

"# 保険金請求の受付・進捗照会 仕様書（研修用の架空サンプル）","",
"> 日数・書類・ステータス・判定基準はすべて例です。実際の査定・支払は保険約款・社内規程・法令に基づきます。健康情報などの要配慮個人情報の扱いは法務・コンプライアンスの確認を受けます。AIに入力するデータはマスキングと規程確認が前提です。","",

"| 目的 | 契約者がWebで保険金を請求し、書類提出と進捗照会ができるようにする。事務担当が請求を確認・管理できるようにする |",
"| 対象外 | 査定・支払判定のロジック本体、再保険処理 |","| 利用者 | 契約者、被保険者（代理請求を含む）、保険金事務担当 |",

"## FR-001 契約の有効性の確認","システムは、請求の受付時に、事由発生日が保険期間内であることを契約管理システムで確認しなければならない。",

"- 確認事項（顧客へ）：「失効」「解約」「猶予期間」の扱いの定義","",
"## FR-002 請求者の権限確認","システムは、請求者が契約者・被保険者・受取人・登録済みの代理人のいずれかであることを確認しなければならない。",
"- 理由・意図：権限のない第三者による請求と情報照会を防ぐため",
"- 受入基準：","  - Given 登録のない第三者 / When 請求する / Then 受け付けず、事務担当への連絡を案内する",
"- 確認事項（顧客へ）：代理請求の本人確認と委任の確認方法","",
"## FR-003 必要書類の表示","システムは、請求の種類（入院・通院・死亡・満期）に応じた必要書類を画面に表示しなければならない。",
"- 理由・意図：書類不足による差戻しを減らすため",
"- 受入基準：","  - Given 種類＝入院 / When 選択する / Then 入院の必要書類一覧が表示される",
"- 確認事項（顧客へ）：書類の種類・数は商品ごとに異なるか","",
"## FR-004 提出ファイルの検査","システムは、提出ファイルの形式（PDF・JPEG）とサイズ（1ファイル10MB以下）を検査しなければならない。",
"- 理由・意図：事務処理の妨げと、不正なファイルの混入を防ぐため",

"- 確認事項（顧客へ）：ウイルス検査の仕組み・保存先・保存期間","",
"## FR-005 重複請求の検知","システムは、同一契約・同一事由の請求を検知した場合、受付を止めずに事務担当へ重複の可能性を通知しなければならない。",

"- 確認事項（顧客へ）：重複の判定条件（事由日・診療機関）","",
"## FR-006 進捗の照会","システムは、請求者が自分の請求の進捗ステータスを照会できるようにしなければならない。",

"## FR-007 ステータス変更の制限","システムは、進捗ステータスの変更を、事務担当の操作または他システムからの連携に限らなければならない。",

"- 受入基準：","  - Given 契約者の画面 / When ステータス変更を送信する / Then 拒否する",
"- 確認事項（顧客へ）：支払決定の承認者と記録方法","",

"- 確認事項（顧客へ）：ログの保存期間・参照権限・定期点検の頻度","",

      '<li>記入例を見てから、自分の内容に書き換える。右側の結果はすぐに変わります</li><li>結果は「コピー」か「保存」で持ち出す。最終判断は人が行います</li></ol>'+
      '<h3>タブごとの使い方</h3><div class="tbl"><table><thead><tr><th>タブ</th><th>何をするか</th><th>持ち出せるもの</th></tr></thead><tbody>'+
      TABS.map(function(t){ var h = HELP[t.id] || ["",""]; return '<tr'+(t.id===cur?' class="cur"':'')+'><td><button class="linkbtn" data-goto="'+t.id+'">'+esc(t.label)+'</button>'+(t.id===cur?' <span class="chip t">いまここ</span>':'')+'</td><td>'+esc(h[0])+'</td><td>'+esc(h[1])+'</td></tr>'; }).join("")+
      '</tbody></table></div>'+
      '<h3>右上のボタン</h3><ul><li><b>？ 使い方</b>：この画面を開く</li><li><b>🔊 音</b>：ボタンを押したときの効果音を出す・消す（設定は覚えます）</li>'+
      '<li><b>🐞</b>：ログ（操作・保存・エラーの記録）を見る。うまく動かないときは、ログを保存して講師やサポートに渡してください</li></ul>'+
      '<h3>データの扱い</h3><ul><li>入力した内容は、このブラウザの中だけに保存します。外部へは送信しません（AIも呼び出しません）</li>'+
      '<li>プライベートウィンドウなど保存できない環境では、開いている間だけ覚えます</li><li>顧客情報・個人情報は、社内ルールで許可された範囲で入力してください</li></ul>'+
      '<h3>利用上の注意</h3><ul><li>解析・点検・見積もりの結果は「候補」です。正しさを保証するものではありません。採否と最終判断は利用者が行います</li>'+
      '<li>規格・ガイドラインは考え方の参考です。準拠の証明ではありません。版と本文は原典で確認してください</li>'+
      '<li>共用のPCでは、使い終わったら 🐞 の画面の「このブラウザから工房のデータを消す」で消してください</li></ul>'+
      '<h3>更新履歴</h3><ul>'+(SDD.APP.history||[]).map(function(x){ return '<li>v'+esc(x[0])+'：'+esc(x[1])+'</li>'; }).join("")+'</ul>'+
      '<h3>困ったとき</h3><div class="tbl"><table><tbody>'+
      '<tr><td>コピーできない</td><td>文字が選択された状態になります。Ctrl+C（Mac は ⌘+C）でコピーします</td></tr>'+
      '<tr><td>保存できない</td><td>保存の確認が出たら「保存」を選びます。出ない場合は「コピー」を使い、メモ帳などに貼って保存します</td></tr>'+
      '<tr><td>音が鳴らない</td><td>端末の音量・消音を確認します。ブラウザによっては最初の1回目が鳴らないことがあります</td></tr>'+
      '<tr><td>読み込めない</td><td>.md／.txt／.json（UTF-8、2MBまで）を選びます。理由は画面と 🐞 ログに出ます</td></tr>'+
      '<tr><td>タブをキーで移る</td><td>タブにフォーカスを置き、← → で移ります。Home・End で最初・最後のタブへ移ります</td></tr>'+
      '<tr><td>解析が遅い</td><td>大きなソース（20万字以上）は数秒かかります。関係するファイルだけを貼ると速くなります</td></tr>'+
      '</tbody></table></div>';
  }
  function bugHtml(){
    var ls = (function(){ try { localStorage.setItem("sdd:__t","1"); localStorage.removeItem("sdd:__t"); return "使える"; } catch(e){ return "使えない（開いている間だけ覚えます）"; } })();
    var env = [["版", SDD.APP.name+" "+SDD.APP.grade+" v"+SDD.APP.version],["表示中のタブ", curTab],["ブラウザ", navigator.userAgent],
      ["画面", window.innerWidth+"×"+window.innerHeight],["ブラウザ内の保存", ls],["効果音", Sound.on ? "オン" : "オフ"],["ファイル保存", dlState],["記録件数", LOG.length+"件（最大"+LOG_MAX+"件）"]];
    var lv = $("#bugLv") ? $("#bugLv").value : "";
    var rows = LOG.slice().reverse().filter(function(r){ return !lv || r.level === lv; });
    return '<div class="dlg-head"><h2 id="bugTitle">🐞 ログ（デバッグ）</h2><button class="btn sm ghost" data-close>閉じる</button></div>'+
      '<p class="note">操作・保存・読み込み・エラーを記録しています。入力した本文は記録しません。記録はこの画面を閉じても、ページを開いている間は残ります。</p>'+
      '<div class="tbl"><table><tbody>'+env.map(function(e){ return '<tr><th style="width:9em">'+esc(e[0])+'</th><td>'+esc(e[1])+'</td></tr>'; }).join("")+'</tbody></table></div>'+
      '<div class="row"><label for="bugLv" style="flex-direction:row;align-items:center;gap:6px">種類<select id="bugLv" style="width:auto"><option value="">すべて</option>'+
      ["エラー","警告","情報","操作"].map(function(x){ return '<option'+(x===lv?" selected":"")+'>'+x+'</option>'; }).join("")+'</select></label>'+
      '<button class="btn sm ghost" id="bugCopy">コピー</button><button class="btn sm ghost" id="bugSave">保存（.txt）</button><button class="btn sm ghost" id="bugClear">消去</button><button class="btn sm ghost" id="bugTest">動作確認（音とログ）</button><button class="btn sm ghost" id="bugWipe" style="border-color:var(--bad);color:var(--bad)">'+(WIPE.armed ? "もう一度押すと消します" : WIPE.done ? "消しました" : "このブラウザから工房のデータを消す")+'</button></div><p class="note" id="bugWipeMsg" role="status" aria-live="polite">'+esc(WIPE.msg || "共用のPCでは、使い終わったら消してください（入力した議事録・ソース・読了の印・設定が消えます。元に戻せません）。")+'</p>'+
      '<div class="tbl loglist"><table><thead><tr><th>時刻</th><th>種類</th><th>内容</th></tr></thead><tbody>'+
      (rows.length ? rows.map(function(r){ return '<tr class="lv-'+esc(r.level)+'"><td class="num">'+r.t+'</td><td>'+esc(r.level)+'</td><td>'+esc(r.msg)+'</td></tr>'; }).join("") : '<tr><td colspan="3">記録はありません</td></tr>')+
      '</tbody></table></div>';
  }
  function bugText(){
    return ["# うさうさ仕様駆動工房 ログ", "版: "+SDD.APP.grade+" v"+SDD.APP.version, "保存日時: "+new Date().toISOString(), "ブラウザ: "+navigator.userAgent, "ファイル保存: "+dlState, ""]
      .concat(LOG.map(function(r){ return r.t+"\t"+r.level+"\t"+r.msg; })).join("\n");
  }
  function makeDialog(id, labelId){
    var d = document.createElement("dialog"); d.id = id; d.setAttribute("aria-labelledby", labelId); document.body.appendChild(d);
    d.addEventListener("click", function(e){ if (e.target === d) closeDlg(d); });
    d.addEventListener("cancel", function(e){ e.preventDefault(); closeDlg(d); });
    return d;
  }
  var lastFocus = null, WIPE = {armed:false, done:false, msg:"", timer:null};
  function openDlg(d){ lastFocus = document.activeElement; try { if (d.showModal) d.showModal(); else d.setAttribute("open",""); } catch(e){ d.setAttribute("open",""); } var c = d.querySelector("[data-close]"); if (c) c.focus(); }
  function closeDlg(d){ try { if (d.close) d.close(); else d.removeAttribute("open"); } catch(e){ d.removeAttribute("open"); } if (lastFocus && lastFocus.focus) lastFocus.focus(); }
  function initChrome(){
    var help = makeDialog("helpDlg","helpTitle"), bug = makeDialog("bugDlg","bugTitle");
    function drawHelp(){
      help.innerHTML = helpHtml(curTab);
      help.querySelector("[data-close]").addEventListener("click", function(){ closeDlg(help); });
      help.querySelectorAll("[data-goto]").forEach(function(b){ b.addEventListener("click", function(){ closeDlg(help); openTab(b.dataset.goto); }); });
    }
    function drawBug(){
      var keepLv = $("#bugLv") ? $("#bugLv").value : "";
      bug.innerHTML = bugHtml(); if (keepLv && $("#bugLv")) $("#bugLv").value = keepLv;
      bug.querySelector("[data-close]").addEventListener("click", function(){ closeDlg(bug); });
      $("#bugLv").addEventListener("change", drawBug);
      $("#bugCopy").addEventListener("click", function(){ copyText(bugText(), this); });
      $("#bugSave").addEventListener("click", function(){ var d = new Date(); saveFile("工房ログ_"+d.getFullYear()+("0"+(d.getMonth()+1)).slice(-2)+("0"+d.getDate()).slice(-2)+"_"+("0"+d.getHours()).slice(-2)+("0"+d.getMinutes()).slice(-2)+".txt", bugText(), this); });
      $("#bugClear").addEventListener("click", function(){ LOG.length = 0; log("情報", "ログを消去しました"); });
      $("#bugWipe").addEventListener("click", function(){
        if (!WIPE.armed){
          WIPE.armed = true; WIPE.done = false; WIPE.msg = "本当に消しますか？5秒以内にもう一度押すと消します。"; clearTimeout(WIPE.timer);
          WIPE.timer = setTimeout(function(){ if (WIPE.armed){ WIPE.armed = false; WIPE.msg = "取り消しました。"; if (bug.open) drawBug(); } }, 5000);
          drawBug(); return;
        }
        clearTimeout(WIPE.timer); WIPE.armed = false; var n = wipeAll(); WIPE.done = true;
        WIPE.msg = "工房のデータを "+n+" 件消しました。ページを開き直すと初期の状態になります。"; Sound.play("ok"); log("情報", "工房のデータを消しました（"+n+"件）"); drawBug();
      });
      $("#bugTest").addEventListener("click", function(){ var was = Sound.on; Sound.on = true; Sound.play("ok"); setTimeout(function(){ Sound.play("err"); Sound.on = was; }, 350); log("情報", "動作確認：音（成功・失敗）を鳴らしました。ログは記録されています"); });
    }
    logListeners.push(function(){ if (bug.open) drawBug(); var n = LOG.filter(function(r){ return r.level === "エラー"; }).length; var b = $("#btnBug"); if (b){ b.dataset.err = n; b.setAttribute("aria-label", "ログを開く（エラー "+n+"件）"); b.title = "ログ（デバッグ）：エラー "+n+"件"; } });
    $("#btnHelp").addEventListener("click", function(){ drawHelp(); openDlg(help); });
    $("#btnBug").addEventListener("click", function(){ drawBug(); openDlg(bug); });
    var sb = $("#btnSound");
    function drawSound(){ sb.textContent = Sound.on ? "🔊 音" : "🔇 音"; sb.setAttribute("aria-pressed", Sound.on); sb.setAttribute("aria-label", Sound.on ? "効果音：オン（押すとオフ）" : "効果音：オフ（押すとオン）"); }
    Sound.on = store.get("sound","1") === "1"; drawSound();
    sb.addEventListener("click", function(){ Sound.on = !Sound.on; store.set("sound", Sound.on ? "1" : "0"); drawSound(); if (Sound.on) Sound.play("ok"); log("情報", "効果音を"+(Sound.on?"オン":"オフ")+"にしました"); });
    /* すべてのボタンで効果音と操作ログ（読み込みのラベル、選択肢のボタンを含む） */
    document.addEventListener("click", function(e){
      var b = e.target.closest ? e.target.closest('button,[role="button"]') : null;
      if (!b || b.disabled || b.id === "btnSound") return;
      Sound.play(b.matches("nav button") ? "tab" : "click");
      log("操作", (b.matches("nav button") ? "タブ：" : "ボタン：")+(b.getAttribute("data-label") || b.textContent || "").replace(/\s+/g," ").trim().slice(0, 40));
    }, true);
    document.addEventListener("keydown", function(e){ if (e.key === "F1" || (e.key === "?" && !/INPUT|TEXTAREA|SELECT/.test((e.target||{}).tagName||""))){ e.preventDefault(); drawHelp(); openDlg(help); } });
    log("情報", "起動："+SDD.APP.name+" "+SDD.APP.grade+" v"+SDD.APP.version);
  }

  /* 起動 */
  var nav = $("#tabs"), main = $("#panels");
  openTab = function(id){ open(id); };
  function open(id){
    var t = TABS.filter(function(x){ return x.id===id; })[0] || TABS[0];
    nav.querySelectorAll("button").forEach(function(b){ var on = b.dataset.tab===t.id; b.setAttribute("aria-selected", on); b.tabIndex = on ? 0 : -1; });
    main.innerHTML = '<section class="panel" role="tabpanel" id="panel" aria-labelledby="tab-'+t.id+'" tabindex="-1">'+t.render()+'</section>';
    t.bind();
    main.querySelectorAll("[data-copy]").forEach(function(b){ b.addEventListener("click", function(){ copy($("#"+b.dataset.copy).textContent, b); }); });
    main.querySelectorAll("[data-save]").forEach(function(b){ b.addEventListener("click", function(){ saveFile(b.dataset.fn, $("#"+b.dataset.save).textContent, b); }); });
    log("情報", "タブを表示："+t.label);
    store.set("tab", t.id); curTab = t.id;
  }
  nav.innerHTML = TABS.map(function(t){ return '<button role="tab" id="tab-'+t.id+'" data-tab="'+t.id+'" aria-selected="false" aria-controls="panel" tabindex="-1">'+esc(t.label)+'</button>'; }).join("");
  nav.setAttribute("aria-label", "作業の切り替え");
  nav.addEventListener("keydown", function(e){
    var bs = Array.prototype.slice.call(nav.querySelectorAll("button")), i = bs.indexOf(document.activeElement), j = -1;
    if (i < 0) return;
    if (e.key === "ArrowRight") j = (i + 1) % bs.length; else if (e.key === "ArrowLeft") j = (i - 1 + bs.length) % bs.length; else if (e.key === "Home") j = 0; else if (e.key === "End") j = bs.length - 1;
    if (j < 0) return;
    e.preventDefault(); open(bs[j].dataset.tab); bs[j].focus(); try { bs[j].scrollIntoView({block:"nearest", inline:"nearest"}); } catch(x){}
  });
  nav.querySelectorAll("button").forEach(function(b){ b.addEventListener("click", function(){ open(b.dataset.tab); }); });
  var VLABEL = SDD.APP.grade+" v"+SDD.APP.version;
  $("#ver").textContent = SDD.APP.name+" "+VLABEL+" ／ うさうさ研修工房「面白きこともなき世を面白く」";
  var hash = (location.hash||"").replace("#","");
  initChrome();
  try { open(hash || store.get("tab","learn")); } catch(e){ log("エラー", "タブを表示できませんでした："+(e.message||e)); open("learn"); }
})();
</script>

</body>
</html>
